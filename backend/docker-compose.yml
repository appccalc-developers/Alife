services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AlifeDevPass123}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  alife-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=alife_db;User Id=sa;Password=AlifeDevPass123;TrustServerCertificate=True;Encrypt=False
      - Jwt__Issuer=alife-api
      - Jwt__Audience=alife-web
      - Jwt__Key=${JWT_KEY}
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__VerifyServiceSid=${TWILIO_VERIFY_SERVICE_SID}
      - Twilio__Channel=${TWILIO_CHANNEL:-sms}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_PLAYLIST_ID=${YOUTUBE_PLAYLIST_ID}
      - LineLogin__ClientId=${LINE_LOGIN_CLIENT_ID}
      - LineLogin__ClientSecret=${LINE_LOGIN_CLIENT_SECRET}
      - LineLogin__RedirectUri=${LINE_LOGIN_REDIRECT_URI}
      - Frontend__BaseUrl=${FRONTEND_BASE_URL}
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
