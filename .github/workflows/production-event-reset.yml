name: Production Event 2.0 Reset

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Protected reset operation
        type: choice
        options:
          - preview
          - apply
          - verify
        required: true
      code_sha:
        description: Exact reviewed commit SHA
        type: string
        required: true
      reset_run_id:
        description: Stable reset run id from the approved preview
        type: string
        required: true
      freeze_epoch:
        description: Active Event write-freeze epoch
        type: string
        required: true
      backup_reference:
        description: Full Azure resource id of the verified named database copy
        type: string
        required: true
      approved_fingerprint:
        description: Fingerprint printed by the approved preview (required for apply)
        type: string
        required: false
      approved_do_fingerprint:
        description: Separate Durable Object inventory fingerprint printed by the approved preview (required for apply and verify)
        type: string
        required: false
      evidence_run_id:
        description: Earlier workflow run containing encrypted preview/apply evidence (required for apply and verify)
        type: string
        required: false
      confirmation:
        description: Type the operation-specific confirmation shown in the workflow source
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-event-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production-event-reset
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EVIDENCE_DIR: ${{ runner.temp }}/event-reset
      ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
      Events__PurgeEnvironment: Production
      Events__ExpectedServer: ${{ vars.EVENT_RESET_SQL_SERVER }}
      Events__ExpectedDatabase: ${{ vars.EVENT_RESET_SQL_DATABASE }}
      Events__TargetResource: ${{ vars.EVENT_RESET_SQL_RESOURCE_ID }}
      Events__CodeSha: ${{ inputs.code_sha }}
      Events__FreezeEpoch: ${{ inputs.freeze_epoch }}
      Events__ResetRunId: ${{ inputs.reset_run_id }}
      Events__VerifiedBackupReference: ${{ inputs.backup_reference }}
      Events__VerifiedBackupConnectionString: ${{ secrets.EVENT_RESET_RECOVERY_DB_CONNECTION_STRING }}
      Events__WriteFreezeConfirmed: 'true'
      Events__BackupVerified: 'true'
      Events__ProtectedEvidenceRoot: ${{ runner.temp }}
      Events__OutputDirectory: ${{ runner.temp }}/event-reset
      EVENT_RESET_FUNCTION_APP_NAME: ${{ vars.EVENT_RESET_FUNCTION_APP_NAME }}
      EVENT_RESET_FUNCTION_RESOURCE_GROUP: ${{ vars.EVENT_RESET_FUNCTION_RESOURCE_GROUP }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate protected inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FINGERPRINT: ${{ inputs.approved_fingerprint }}
          DO_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EVIDENCE_KEY: ${{ secrets.EVENT_RESET_EVIDENCE_KEY }}
          FILE_API_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          FILE_API_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          FILE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_SIGNING_SECRET }}
          FILE_FINALIZE_TOKEN: ${{ secrets.EVENT_RESET_FILE_FINALIZE_TOKEN }}
          FILE_FINALIZE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_FINALIZE_SIGNING_SECRET }}
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          DO_TOKEN: ${{ secrets.EVENT_RESET_DO_TOKEN }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            preview) expected='PREVIEW PRODUCTION EVENT RESET' ;;
            apply)   expected='PURGE ALL PRODUCTION EVENT INSTANCES' ;;
            verify)  expected='VERIFY PRODUCTION EVENT RESET' ;;
            *) exit 1 ;;
          esac
          if [ "$CONFIRMATION" != "$expected" ]; then
            echo 'The operation-specific confirmation does not match.'
            exit 1
          fi
          if [ "$OPERATION" = apply ] && ! [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Apply requires a lowercase SHA-256 preview fingerprint.'
            exit 1
          fi
          if { [ "$OPERATION" = apply ] || [ "$OPERATION" = verify ]; } && ! [[ "$DO_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Apply and verify require the separate lowercase SHA-256 Durable Object preview fingerprint.'
            exit 1
          fi
          if { [ "$OPERATION" = apply ] || [ "$OPERATION" = verify ]; } && ! [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Apply and standalone verify require the prior evidence run id.'
            exit 1
          fi
          [[ "$RESET_RUN_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$RESET_EPOCH" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          if [ "${#EVIDENCE_KEY}" -lt 32 ] || [ "${#FILE_API_TOKEN}" -lt 32 ] || \
             [ "${#FILE_SIGNING_SECRET}" -lt 32 ] || [ "${#FILE_FINALIZE_TOKEN}" -lt 32 ] || \
             [ "${#FILE_FINALIZE_SIGNING_SECRET}" -lt 32 ] || [ "${#FREEZE_STATUS_TOKEN}" -lt 32 ] || \
             [ "${#SPEED_TOKEN}" -lt 32 ] || [ "${#DO_TOKEN}" -lt 32 ] || [ "${#DO_TOKEN}" -gt 4096 ]; then
            echo 'Protected reset secrets are missing or too short.'
            exit 1
          fi
          reset_secrets=("$FILE_API_TOKEN" "$FILE_SIGNING_SECRET" "$FILE_FINALIZE_TOKEN" "$FILE_FINALIZE_SIGNING_SECRET")
          for ((left=0; left<${#reset_secrets[@]}; left++)); do
            for ((right=left+1; right<${#reset_secrets[@]}; right++)); do
              test "${reset_secrets[$left]}" != "${reset_secrets[$right]}"
            done
          done
          for protected_secret in "${reset_secrets[@]}" "$SPEED_TOKEN"; do
            test "$DO_TOKEN" != "$protected_secret"
          done
          test -n "$FILE_API_URL"
          test -n "$FREEZE_STATUS_URL"
          test -n "$SPEED_URL"
          test -n "${ConnectionStrings__Default:-}"
          test -n "${Events__VerifiedBackupConnectionString:-}"
          test -n "${Events__ExpectedServer:-}"
          test -n "${Events__ExpectedDatabase:-}"
          test -n "${Events__TargetResource:-}"
          test -n "${EVENT_RESET_FUNCTION_APP_NAME:-}"
          test -n "${EVENT_RESET_FUNCTION_RESOURCE_GROUP:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'a76a4cf2fe42e20167837ba5fce117d0'

      - name: Checkout reviewed code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0

      - name: Confirm immutable code identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.code_sha }}"
          git branch --remotes --contains HEAD | grep -Eq 'origin/main$'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build reset tool without running migrations
        run: dotnet build backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Azure login with reset environment identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to replace an active rollback hold
        shell: bash
        env:
          EXPECTED_PREPARATION_SHA: ${{ vars.EVENT2_PREPARATION_RELEASE_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          rollback_hold="$(jq -r '.[] | select(.name == "EVENT_RESET_ROLLBACK_HOLD") | .value' <<<"$settings" | tail -n1)"
          rollback_state="$(jq -r '.[] | select(.name == "EVENT_RESET_ROLLBACK_STATE") | .value' <<<"$settings" | tail -n1)"
          finalize_state="$(jq -r '.[] | select(.name == "EVENT_RESET_FINALIZE_STATE") | .value' <<<"$settings" | tail -n1)"
          if [ "${rollback_hold,,}" = true ] || [ -n "$rollback_state" ] || [ -n "$finalize_state" ]; then
            echo 'The Event reset cannot continue while rollback or recovery finalization state exists.'
            exit 1
          fi
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          preparation_sha="$(setting EVENT_RESET_PREPARATION_SHA)"
          preparation_run_id="$(setting EVENT_RESET_PREPARATION_RUN_ID)"
          test "$(setting EVENT_RESET_PREPARATION_STATE)" = verified
          test "$(setting EVENT_RESET_PREPARATION_LEGACY_RUNTIME_PRESERVED)" = true
          [[ "$EXPECTED_PREPARATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$preparation_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$preparation_run_id" =~ ^[0-9]+$ ]]
          test "$preparation_sha" = "$EXPECTED_PREPARATION_SHA"
          test "$preparation_sha" != "${{ inputs.code_sha }}"
          preparation_run="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$preparation_run_id")"
          test "$(jq -r '.status' <<<"$preparation_run")" = completed
          test "$(jq -r '.conclusion' <<<"$preparation_run")" = success
          test "$(jq -r '.head_sha' <<<"$preparation_run")" = "$preparation_sha"

      - name: Bind the running backend and protected SQL inputs to one target
        id: target_binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(az functionapp show \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --query state --output tsv)" = Running
          app_connection="$(az functionapp config appsettings list \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --query "[?name=='ConnectionStrings__Default'].value | [0]" \
            --only-show-errors --output tsv)"
          protected_connection="${ConnectionStrings__Default:-}"
          test -n "$app_connection"
          test -n "$protected_connection"

          binding_root="$RUNNER_TEMP/event-reset-target-binding"
          rm -rf "$binding_root"
          mkdir -p "$binding_root/app" "$binding_root/protected"
          ConnectionStrings__Default="$app_connection" dotnet run \
            --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:TargetIdentity=inspect \
            --Events:OutputDirectory="$binding_root/app"
          ConnectionStrings__Default="$protected_connection" dotnet run \
            --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:TargetIdentity=inspect \
            --Events:OutputDirectory="$binding_root/protected"

          app_hash="$(jq -er '.targetIdentityHash | strings | select(test("^[0-9a-f]{64}$"))' \
            "$binding_root/app/event-reset-target-identity.json")"
          protected_hash="$(jq -er '.targetIdentityHash | strings | select(test("^[0-9a-f]{64}$"))' \
            "$binding_root/protected/event-reset-target-identity.json")"
          test "$app_hash" = "$protected_hash"
          printf 'target_identity_hash=%s\n' "$app_hash" >> "$GITHUB_OUTPUT"

      - name: Verify named recovery database copy
        shell: bash
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          case "$BACKUP_REFERENCE" in
            /subscriptions/*/resourceGroups/*/providers/Microsoft.Sql/servers/*/databases/*) ;;
            *) echo 'backup_reference must be a full Azure SQL database resource id.'; exit 1 ;;
          esac
          state="$(az resource show --ids "$BACKUP_REFERENCE" --query properties.status -o tsv)"
          test "$state" = Online
          source_id="${Events__TargetResource,,}"
          backup_id="${BACKUP_REFERENCE,,}"
          test "$source_id" != "$backup_id"

      - name: Freeze backend Event writes at the reviewed epoch
        shell: bash
        env:
          BACKEND_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          BACKEND_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --settings \
              'EVENT_RUNTIME_ENVIRONMENT=production' \
              'EVENT_SCHEMA_EPOCH=2.0.0' \
              "EVENT_DATA_EPOCH=$RESET_EPOCH" \
              'EVENT_WRITE_MODE=frozen' \
              "EVENT_WRITE_FREEZE_EPOCH=$RESET_EPOCH" \
            --only-show-errors --output none
          for attempt in {1..18}; do
            backend="$(curl --silent --show-error -H "Authorization: Bearer $BACKEND_STATUS_TOKEN" \
              "$BACKEND_STATUS_URL" || true)"
            if [ "$(jq -r '.ready // false' <<<"$backend" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // false' <<<"$backend" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetEpoch // empty' <<<"$backend" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$backend" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$backend" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.targetIdentityHash // empty' <<<"$backend" 2>/dev/null || true)" = "$EXPECTED_TARGET_IDENTITY_HASH" ] && \
               [ "$(jq -r '.activeMutations // -1' <<<"$backend" 2>/dev/null || true)" = 0 ] && \
               [ "$(jq -r '.scheduledJobsAcknowledged // false' <<<"$backend" 2>/dev/null || true)" = true ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Backend did not drain and acknowledge the exact reviewed freeze epoch.'
          exit 1

      - name: Build the reviewed Speed Layer freeze artifact
        shell: bash
        env:
          CLOUDFLARE_API_CACHE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_API_CACHE_NAMESPACE_ID }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          RESET_OPERATION: ${{ inputs.operation }}
          APPROVED_DO_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
        run: |
          set -euo pipefail
          npm ci --prefix cloudflare/alife-app
          npm run generate:public-home-bootstrap --prefix cloudflare/alife-app
          npm run build --prefix cloudflare/alife-app
          npm ci --prefix cloudflare/speed-layer
          npm run prepare:deploy-config --prefix cloudflare/speed-layer
          node --input-type=module -e \
            'import fs from "node:fs"; const p="cloudflare/speed-layer/.wrangler.deploy.jsonc"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.vars={...c.vars,EVENT_DATA_EPOCH:process.env.RESET_EPOCH,EVENT_WRITE_MODE:"frozen",EVENT_WRITE_FREEZE_EPOCH:process.env.RESET_EPOCH}; if(process.env.RESET_OPERATION==="apply") c.vars.EVENT_RESET_DO_APPROVED_FINGERPRINT=process.env.APPROVED_DO_FINGERPRINT; else delete c.vars.EVENT_RESET_DO_APPROVED_FINGERPRINT; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'

      - name: Freeze the Speed Layer at the reviewed epoch
        shell: bash
        env:
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          npx wrangler@4.88.0 deploy --config cloudflare/speed-layer/.wrangler.deploy.jsonc
          for attempt in {1..18}; do
            speed="$(curl --silent --show-error -H "Authorization: Bearer $SPEED_TOKEN" \
              "$SPEED_URL/api/internal/event-reset/status" || true)"
            if [ "$(jq -r '.ready // false' <<<"$speed" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // false' <<<"$speed" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetEpoch // empty' <<<"$speed" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$speed" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$speed" 2>/dev/null || true)" = "$RESET_EPOCH" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Speed Layer did not enter the exact reviewed freeze epoch.'
          exit 1

      - name: Freeze the Images API at the reviewed epoch
        shell: bash
        env:
          IMAGES_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          IMAGES_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          FILE_API_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          FILE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_SIGNING_SECRET }}
          FILE_FINALIZE_TOKEN: ${{ secrets.EVENT_RESET_FILE_FINALIZE_TOKEN }}
          FILE_FINALIZE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_FINALIZE_SIGNING_SECRET }}
          TARGET_RESOURCE: ${{ vars.EVENT_RESET_SQL_RESOURCE_ID }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({EVENT_RESET_FILE_ADMIN_SECRET:process.env.FILE_API_TOKEN,EVENT_RESET_FILE_SIGNING_SECRET:process.env.FILE_SIGNING_SECRET,EVENT_RESET_FILE_FINALIZE_SECRET:process.env.FILE_FINALIZE_TOKEN,EVENT_RESET_FILE_FINALIZE_SIGNING_SECRET:process.env.FILE_FINALIZE_SIGNING_SECRET,EVENT_RESET_TARGET_RESOURCE:process.env.TARGET_RESOURCE}))' |
            npx wrangler@4.88.0 secret bulk --config cloudflare/images-api/wrangler.toml
          npx wrangler@4.88.0 deploy --config cloudflare/images-api/wrangler.toml \
            --var 'EVENT_WRITE_MODE:frozen' \
            --var "EVENT_WRITE_FREEZE_EPOCH:$RESET_EPOCH"
          for attempt in {1..18}; do
            images="$(curl --silent --show-error -H "Authorization: Bearer $IMAGES_TOKEN" \
              "$IMAGES_URL/api/admin/event-reset/status" || true)"
            if [ "$(jq -r '.ready // false' <<<"$images" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // false' <<<"$images" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetEpoch // empty' <<<"$images" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$images" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.targetResource // empty' <<<"$images" 2>/dev/null || true)" = "$Events__TargetResource" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Images API did not enter the exact reviewed freeze epoch.'
          exit 1

      - name: Verify every Event writer is frozen at the reviewed epoch
        shell: bash
        env:
          BACKEND_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          BACKEND_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          IMAGES_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          IMAGES_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          backend="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BACKEND_STATUS_TOKEN" "$BACKEND_STATUS_URL")"
          speed="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SPEED_TOKEN" "$SPEED_URL/api/internal/event-reset/status")"
          images="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $IMAGES_TOKEN" "$IMAGES_URL/api/admin/event-reset/status")"
          for payload in "$backend" "$speed" "$images"; do
            test "$(jq -r '.ready' <<<"$payload")" = true
            test "$(jq -r '.frozen' <<<"$payload")" = true
            test "$(jq -r '.resetEpoch' <<<"$payload")" = "$RESET_EPOCH"
            test "$(jq -r '.schemaEpoch' <<<"$payload")" = '2.0.0'
          done
          test "$(jq -r '.dataEpoch' <<<"$backend")" = "$RESET_EPOCH"
          test "$(jq -r '.targetIdentityHash' <<<"$backend")" = "$EXPECTED_TARGET_IDENTITY_HASH"
          test "$(jq -r '.dataEpoch' <<<"$speed")" = "$RESET_EPOCH"
          test "$(jq -r '.targetResource' <<<"$images")" = "${Events__TargetResource}"
          test "$(jq -r '.scheduledJobsAcknowledged' <<<"$backend")" = true
          test "$(jq -r '.activeMutations' <<<"$backend")" = 0

      - name: Stop every backend instance for the protected SQL phase
        id: stop_backend
        shell: bash
        env:
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          az functionapp stop --name "$EVENT_RESET_FUNCTION_APP_NAME" --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" --only-show-errors
          stopped_checks=0
          for attempt in {1..36}; do
            state="$(az functionapp show --name "$EVENT_RESET_FUNCTION_APP_NAME" --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" --query state -o tsv)"
            if [ "$state" = Stopped ]; then
              stopped_checks=$((stopped_checks + 1))
              if [ "$stopped_checks" -ge 3 ]; then break; fi
            else
              stopped_checks=0
            fi
            sleep 5
          done
          if [ "$stopped_checks" -lt 3 ]; then
            echo 'Backend Function App did not remain Stopped for three consecutive probes; protected SQL work is blocked.'
            exit 1
          fi
          mkdir -p "$EVIDENCE_DIR"
          stopped_utc="$(date -u +%FT%TZ)"
          jq -n \
            --arg functionApp "$EVENT_RESET_FUNCTION_APP_NAME" \
            --arg resourceGroup "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --arg resetEpoch "$RESET_EPOCH" \
            --arg targetIdentityHash "$EXPECTED_TARGET_IDENTITY_HASH" \
            --arg stoppedUtc "$stopped_utc" \
            '{functionApp:$functionApp,resourceGroup:$resourceGroup,state:"Stopped",consecutiveStoppedProbes:3,resetEpoch:$resetEpoch,dataEpoch:$resetEpoch,targetIdentityHash:$targetIdentityHash,stoppedUtc:$stoppedUtc}' \
            > "$EVIDENCE_DIR/backend-stop-receipt.json"

      - name: Resolve SQL server and runner IP
        id: sqlfw
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --retry 5 --retry-all-errors -fsSL https://api.ipify.org | tr -d '[:space:]')"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          server_entry="$(printf '%s' "$ConnectionStrings__Default" | tr ';' '\n' | grep -E -i '^(server|data source)=' | head -n1 | cut -d= -f2-)"
          server_entry="${server_entry#tcp:}"
          server_fqdn="${server_entry%%,*}"
          server_name="${server_fqdn%%.*}"
          test -n "$server_name"
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          echo "server_name=$server_name" >> "$GITHUB_OUTPUT"
          echo "rule_name=event-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Allow only this runner through Azure SQL firewall
        shell: bash
        run: |
          set -euo pipefail
          az sql server firewall-rule create \
            --resource-group "${{ vars.EVENT_RESET_SQL_RESOURCE_GROUP }}" \
            --server "${{ steps.sqlfw.outputs.server_name }}" \
            --name "${{ steps.sqlfw.outputs.rule_name }}" \
            --start-ip-address "${{ steps.sqlfw.outputs.runner_ip }}" \
            --end-ip-address "${{ steps.sqlfw.outputs.runner_ip }}" \
            --only-show-errors --output none

      - name: Restore approved evidence for apply or standalone verify
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        uses: actions/download-artifact@v5
        with:
          name: production-event-reset-evidence-${{ inputs.evidence_run_id }}
          path: ${{ runner.temp }}/approved-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}

      - name: Authenticate and decrypt approved evidence
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          EVIDENCE_KEY: ${{ secrets.EVENT_RESET_EVIDENCE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          EVIDENCE_FILE="${{ runner.temp }}/approved-evidence/evidence.tgz.enc" \
          HMAC_FILE="${{ runner.temp }}/approved-evidence/evidence.tgz.enc.hmac" \
          node --input-type=module -e \
            'import {createHmac,timingSafeEqual} from "node:crypto"; import fs from "node:fs"; const expected=fs.readFileSync(process.env.HMAC_FILE,"utf8").trim(); if(!/^[0-9a-f]{64}$/.test(expected)) throw new Error("Invalid evidence HMAC."); const actual=createHmac("sha256",process.env.EVIDENCE_KEY).update(fs.readFileSync(process.env.EVIDENCE_FILE)).digest("hex"); if(!timingSafeEqual(Buffer.from(actual,"hex"),Buffer.from(expected,"hex"))) throw new Error("Evidence authentication failed.");'
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "${{ runner.temp }}/approved-evidence/evidence.tgz.enc" \
            -out "${{ runner.temp }}/approved-evidence/evidence.tgz" \
            -pass env:EVIDENCE_KEY
          tar -xzf "${{ runner.temp }}/approved-evidence/evidence.tgz" -C "$EVIDENCE_DIR"

      - name: Validate approved preview evidence for this reset run
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
          CODE_SHA: ${{ inputs.code_sha }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          APPROVED_FINGERPRINT: ${{ inputs.approved_fingerprint }}
          APPROVED_DO_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
        run: |
          set -euo pipefail
          prior_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN_ID")"
          test "$(jq -r '.path' <<<"$prior_run")" = '.github/workflows/production-event-reset.yml'
          test "$(jq -r '.event' <<<"$prior_run")" = workflow_dispatch
          test "$(jq -r '.head_sha' <<<"$prior_run")" = "$CODE_SHA"
          test -f "$EVIDENCE_DIR/preview.json"
          test -f "$EVIDENCE_DIR/durable-objects-preview.json"
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/preview.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.codeSha' "$EVIDENCE_DIR/preview.json")" = "$CODE_SHA"
          test "$(jq -r '.freezeEpoch' "$EVIDENCE_DIR/preview.json")" = "$RESET_EPOCH"
          test "$(jq -r '.backupReference' "$EVIDENCE_DIR/preview.json")" = "$BACKUP_REFERENCE"
          if [ "${{ inputs.operation }}" = apply ]; then
            test "$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")" = "$APPROVED_FINGERPRINT"
          fi
          test "$(jq -r '.fingerprint' "$EVIDENCE_DIR/durable-objects-preview.json")" = "$APPROVED_DO_FINGERPRINT"
          EVENT_RESET_EVIDENCE_DIR="$EVIDENCE_DIR" \
          EVENT_RESET_RUN_ID="$RESET_RUN_ID" \
          EVENT_RESET_FREEZE_EPOCH="$RESET_EPOCH" \
          EVENT_RESET_CODE_SHA="$CODE_SHA" \
          node --input-type=module -e \
            'import fs from "node:fs"; import path from "node:path"; import {inventoryFingerprint,sha256} from "./cloudflare/speed-layer/scripts/reset-event-durable-objects.mjs"; const p=JSON.parse(fs.readFileSync(path.join(process.env.EVENT_RESET_EVIDENCE_DIR,"durable-objects-preview.json"),"utf8")); const inventory={...p.inventory}; const inventoryHash=inventory.inventoryHash; delete inventory.inventoryHash; const context={accountId:p.inventory.accountId,codeSha:process.env.EVENT_RESET_CODE_SHA,resetRunId:process.env.EVENT_RESET_RUN_ID,resetEpoch:process.env.EVENT_RESET_FREEZE_EPOCH}; if(p.codeSha!==context.codeSha||p.resetRunId!==context.resetRunId||p.resetEpoch!==context.resetEpoch||sha256(inventory)!==inventoryHash||inventoryFingerprint(context,inventory)!==p.fingerprint) throw new Error("Durable Object preview evidence failed integrity validation.");'

      - name: Validate exact committed evidence before standalone verify resumes side effects
        if: inputs.operation == 'verify'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
          CODE_SHA: ${{ inputs.code_sha }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          prior_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN_ID")"
          test "$(jq -r '.path' <<<"$prior_run")" = '.github/workflows/production-event-reset.yml'
          test "$(jq -r '.event' <<<"$prior_run")" = workflow_dispatch
          test "$(jq -r '.head_sha' <<<"$prior_run")" = "$CODE_SHA"
          test -f "$EVIDENCE_DIR/preview.json"
          test -f "$EVIDENCE_DIR/apply.json"
          test -f "$EVIDENCE_DIR/r2-delete-manifest.json"
          test -f "$EVIDENCE_DIR/file-backup-receipt.json"
          test -f "$EVIDENCE_DIR/durable-objects-preview.json"
          test -f "$EVIDENCE_DIR/durable-objects-apply.json"
          test -f "$EVIDENCE_DIR/durable-objects-purge-receipts.json"
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/apply.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.codeSha' "$EVIDENCE_DIR/apply.json")" = "$CODE_SHA"
          test "$(jq -r '.backupReference' "$EVIDENCE_DIR/apply.json")" = "$BACKUP_REFERENCE"
          test "$(jq -r '.freezeEpoch' "$EVIDENCE_DIR/apply.json")" = "$RESET_EPOCH"
          test "$(jq -r '.previewFingerprint' "$EVIDENCE_DIR/apply.json")" = "$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          test "$(jq -r '.fileManifestHash' "$EVIDENCE_DIR/apply.json")" = "$(jq -r '.manifestHash' "$EVIDENCE_DIR/r2-delete-manifest.json")"
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/r2-delete-manifest.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.operation' "$EVIDENCE_DIR/file-backup-receipt.json")" = backup
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.manifestHash' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$(jq -r '.fileManifestHash' "$EVIDENCE_DIR/apply.json")"
          test "$(jq -r '.backupReference' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$BACKUP_REFERENCE"
          test "$(jq -r '.approvedFingerprint' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          test "$(jq -r '.targetResource' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$Events__TargetResource"
          test "$(jq -r '.resetEpoch' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$RESET_EPOCH"
          test "$(jq -r '.schemaEpoch' "$EVIDENCE_DIR/file-backup-receipt.json")" = '2.0.0'
          test "$(jq -r '.verified' "$EVIDENCE_DIR/file-backup-receipt.json")" = true
          test "$(jq '.failures | length' "$EVIDENCE_DIR/file-backup-receipt.json")" = 0
          do_fingerprint="$(jq -er '.fingerprint | strings | select(test("^[0-9a-f]{64}$"))' "$EVIDENCE_DIR/durable-objects-preview.json")"
          test "$(jq -r '.approvedFingerprint' "$EVIDENCE_DIR/durable-objects-apply.json")" = "$do_fingerprint"
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/durable-objects-apply.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.resetEpoch' "$EVIDENCE_DIR/durable-objects-apply.json")" = "$RESET_EPOCH"
          test "$(jq -r '.dataEpoch' "$EVIDENCE_DIR/durable-objects-apply.json")" = "$RESET_EPOCH"
          test "$(jq -r '.schemaEpoch' "$EVIDENCE_DIR/durable-objects-apply.json")" = '2.0.0'
          test "$(jq -r '.codeSha' "$EVIDENCE_DIR/durable-objects-apply.json")" = "$CODE_SHA"
          test "$(jq -r '.verified' "$EVIDENCE_DIR/durable-objects-apply.json")" = true
          test "$(jq -r '.approvedFingerprint' "$EVIDENCE_DIR/durable-objects-purge-receipts.json")" = "$do_fingerprint"
          test "$(jq -r '.receiptHash' "$EVIDENCE_DIR/durable-objects-purge-receipts.json")" = "$(jq -r '.receiptHash' "$EVIDENCE_DIR/durable-objects-apply.json")"
          test "$(jq -r '.receiptCount' "$EVIDENCE_DIR/durable-objects-purge-receipts.json")" = "$(jq -r '.batchCount' "$EVIDENCE_DIR/durable-objects-apply.json")"
          node --input-type=module -e \
            'import fs from "node:fs"; import path from "node:path"; import {sha256} from "./cloudflare/speed-layer/scripts/reset-event-durable-objects.mjs"; const root=process.env.EVIDENCE_DIR; const preview=JSON.parse(fs.readFileSync(path.join(root,"durable-objects-preview.json"),"utf8")); const apply=JSON.parse(fs.readFileSync(path.join(root,"durable-objects-apply.json"),"utf8")); const receiptEvidence=JSON.parse(fs.readFileSync(path.join(root,"durable-objects-purge-receipts.json"),"utf8")); const identity=preview.inventory.namespaces.map(({className,namespace,namespaceId,useSqlite})=>({className,namespace,namespaceId,useSqlite})); if(sha256(receiptEvidence.receipts)!==receiptEvidence.receiptHash||sha256(identity)!==apply.namespaceIdentityHash) throw new Error("Durable Object apply evidence failed integrity validation.");'

      - name: Create current protected preview
        if: inputs.operation != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          dotnet run --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:PurgeInstances=preview

      - name: Confirm approved fingerprint
        if: inputs.operation == 'apply'
        shell: bash
        env:
          APPROVED_FINGERPRINT: ${{ inputs.approved_fingerprint }}
        run: |
          set -euo pipefail
          actual="$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          test "$actual" = "$APPROVED_FINGERPRINT"

      - name: Create current Event Durable Object preview
        if: inputs.operation == 'preview'
        shell: bash
        env:
          EVENT_RESET_SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          EVENT_RESET_SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          EVENT_RESET_DO_TOKEN: ${{ secrets.EVENT_RESET_DO_TOKEN }}
          EVENT_RESET_RUN_ID: ${{ inputs.reset_run_id }}
          EVENT_RESET_FREEZE_EPOCH: ${{ inputs.freeze_epoch }}
          EVENT_RESET_CODE_SHA: ${{ inputs.code_sha }}
          EVENT_RESET_EVIDENCE_DIR: ${{ runner.temp }}/event-reset
        run: |
          set -euo pipefail
          node cloudflare/speed-layer/scripts/reset-event-durable-objects.mjs preview

      - name: Confirm approved Durable Object fingerprint
        if: inputs.operation == 'apply'
        shell: bash
        env:
          APPROVED_DO_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
        run: |
          set -euo pipefail
          actual="$(jq -er '.fingerprint | strings | select(test("^[0-9a-f]{64}$"))' "$EVIDENCE_DIR/durable-objects-preview.json")"
          test "$actual" = "$APPROVED_DO_FINGERPRINT"

      - name: Back up exact Event file manifest
        if: inputs.operation == 'preview' || inputs.operation == 'apply'
        shell: bash
        env:
          FILE_API_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          FILE_API_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          EVENT_RESET_FILE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_SIGNING_SECRET }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          fingerprint="$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          jq --arg operation backup --arg backupReference "$BACKUP_REFERENCE" --arg approvedFingerprint "$fingerprint" \
            --arg resetEpoch "$RESET_EPOCH" --arg schemaEpoch '2.0.0' --arg targetResource "$Events__TargetResource" \
            '. + {operation:$operation, backupReference:$backupReference, approvedFingerprint:$approvedFingerprint, resetEpoch:$resetEpoch, schemaEpoch:$schemaEpoch, targetResource:$targetResource}' \
            "$EVIDENCE_DIR/file-manifest.json" > "$EVIDENCE_DIR/file-backup-request.json"
          signature="$(node .github/scripts/sign-event-reset-file-request.mjs "$EVIDENCE_DIR/file-backup-request.json")"
          curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FILE_API_TOKEN" -H 'Content-Type: application/json' \
            -H "X-Alife-Event-Reset-Signature: $signature" \
            --data-binary @"$EVIDENCE_DIR/file-backup-request.json" \
            "$FILE_API_URL/api/admin/event-reset/files" > "$EVIDENCE_DIR/file-backup-receipt.json"
          test "$(jq -r '.operation' "$EVIDENCE_DIR/file-backup-receipt.json")" = backup
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/file-backup-receipt.json")" = "${{ inputs.reset_run_id }}"
          test "$(jq -r '.manifestHash' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$(jq -r '.manifestHash' "$EVIDENCE_DIR/file-manifest.json")"
          test "$(jq -r '.backupReference' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$BACKUP_REFERENCE"
          test "$(jq -r '.approvedFingerprint' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$fingerprint"
          test "$(jq -r '.targetResource' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$Events__TargetResource"
          test "$(jq -r '.resetEpoch' "$EVIDENCE_DIR/file-backup-receipt.json")" = "$RESET_EPOCH"
          test "$(jq -r '.schemaEpoch' "$EVIDENCE_DIR/file-backup-receipt.json")" = '2.0.0'
          test "$(jq -r '.verified' "$EVIDENCE_DIR/file-backup-receipt.json")" = true
          test "$(jq '.failures | length' "$EVIDENCE_DIR/file-backup-receipt.json")" = 0

      - name: Reconfirm drained freeze immediately before SQL apply
        if: inputs.operation == 'apply'
        shell: bash
        env:
          BACKEND_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          BACKEND_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          IMAGES_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          IMAGES_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          speed="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SPEED_TOKEN" "$SPEED_URL/api/internal/event-reset/status")"
          images="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $IMAGES_TOKEN" "$IMAGES_URL/api/admin/event-reset/status")"
          test "$(az functionapp show --name "$EVENT_RESET_FUNCTION_APP_NAME" --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" --query state -o tsv)" = Stopped
          for payload in "$speed" "$images"; do
            test "$(jq -r '.ready' <<<"$payload")" = true
            test "$(jq -r '.frozen' <<<"$payload")" = true
            test "$(jq -r '.resetEpoch' <<<"$payload")" = "$RESET_EPOCH"
            test "$(jq -r '.schemaEpoch' <<<"$payload")" = '2.0.0'
          done
          test "$(jq -r '.targetResource' <<<"$images")" = "${Events__TargetResource}"
          test "$(jq -r '.targetIdentityHash' "$EVIDENCE_DIR/backend-stop-receipt.json")" = "$EXPECTED_TARGET_IDENTITY_HASH"

          app_connection="$(az functionapp config appsettings list \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --query "[?name=='ConnectionStrings__Default'].value | [0]" \
            --only-show-errors --output tsv)"
          protected_connection="${ConnectionStrings__Default:-}"
          test -n "$app_connection"
          test -n "$protected_connection"
          binding_root="$RUNNER_TEMP/event-reset-target-preapply"
          rm -rf "$binding_root"
          mkdir -p "$binding_root/app" "$binding_root/protected"
          ConnectionStrings__Default="$app_connection" dotnet run \
            --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:TargetIdentity=inspect \
            --Events:OutputDirectory="$binding_root/app"
          ConnectionStrings__Default="$protected_connection" dotnet run \
            --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:TargetIdentity=inspect \
            --Events:OutputDirectory="$binding_root/protected"
          app_hash="$(jq -er '.targetIdentityHash | strings | select(test("^[0-9a-f]{64}$"))' \
            "$binding_root/app/event-reset-target-identity.json")"
          protected_hash="$(jq -er '.targetIdentityHash | strings | select(test("^[0-9a-f]{64}$"))' \
            "$binding_root/protected/event-reset-target-identity.json")"
          test "$app_hash" = "$EXPECTED_TARGET_IDENTITY_HASH"
          test "$protected_hash" = "$EXPECTED_TARGET_IDENTITY_HASH"
          test "$(az functionapp show \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --query state --output tsv)" = Stopped

      - name: Purge exact reviewed Event Durable Object storage
        if: inputs.operation == 'apply'
        shell: bash
        env:
          EVENT_RESET_SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          EVENT_RESET_SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          EVENT_RESET_DO_TOKEN: ${{ secrets.EVENT_RESET_DO_TOKEN }}
          EVENT_RESET_RUN_ID: ${{ inputs.reset_run_id }}
          EVENT_RESET_FREEZE_EPOCH: ${{ inputs.freeze_epoch }}
          EVENT_RESET_CODE_SHA: ${{ inputs.code_sha }}
          EVENT_RESET_EVIDENCE_DIR: ${{ runner.temp }}/event-reset
          EVENT_RESET_DO_APPROVED_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
        run: |
          set -euo pipefail
          node cloudflare/speed-layer/scripts/reset-event-durable-objects.mjs apply

      - name: Apply exact reviewed SQL reset
        if: inputs.operation == 'apply'
        shell: bash
        env:
          Events__ExpectedFingerprint: ${{ inputs.approved_fingerprint }}
          Events__FileBackupReceiptPath: ${{ runner.temp }}/event-reset/file-backup-receipt.json
        run: |
          set -euo pipefail
          dotnet run --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:PurgeInstances=apply

      - name: Delete or resume deleting exact source Event files after SQL commit
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          FILE_API_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          FILE_API_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          EVENT_RESET_FILE_SIGNING_SECRET: ${{ secrets.EVENT_RESET_FILE_SIGNING_SECRET }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          fingerprint="$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          jq --arg operation delete --arg backupReference "$BACKUP_REFERENCE" --arg approvedFingerprint "$fingerprint" \
            --arg resetEpoch "$RESET_EPOCH" --arg schemaEpoch '2.0.0' --arg targetResource "$Events__TargetResource" \
            '. + {operation:$operation, backupReference:$backupReference, approvedFingerprint:$approvedFingerprint, resetEpoch:$resetEpoch, schemaEpoch:$schemaEpoch, targetResource:$targetResource}' \
            "$EVIDENCE_DIR/r2-delete-manifest.json" > "$EVIDENCE_DIR/file-delete-request.json"
          signature="$(node .github/scripts/sign-event-reset-file-request.mjs "$EVIDENCE_DIR/file-delete-request.json")"
          curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FILE_API_TOKEN" -H 'Content-Type: application/json' \
            -H "X-Alife-Event-Reset-Signature: $signature" \
            --data-binary @"$EVIDENCE_DIR/file-delete-request.json" \
            "$FILE_API_URL/api/admin/event-reset/files" > "$EVIDENCE_DIR/file-delete-receipt.json"
          test "$(jq -r '.operation' "$EVIDENCE_DIR/file-delete-receipt.json")" = delete
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/file-delete-receipt.json")" = "${{ inputs.reset_run_id }}"
          test "$(jq -r '.manifestHash' "$EVIDENCE_DIR/file-delete-receipt.json")" = "$(jq -r '.manifestHash' "$EVIDENCE_DIR/r2-delete-manifest.json")"
          test "$(jq -r '.backupReference' "$EVIDENCE_DIR/file-delete-receipt.json")" = "$BACKUP_REFERENCE"
          test "$(jq -r '.approvedFingerprint' "$EVIDENCE_DIR/file-delete-receipt.json")" = "$fingerprint"
          test "$(jq -r '.targetResource' "$EVIDENCE_DIR/file-delete-receipt.json")" = "$Events__TargetResource"
          test "$(jq -r '.resetEpoch' "$EVIDENCE_DIR/file-delete-receipt.json")" = "$RESET_EPOCH"
          test "$(jq -r '.schemaEpoch' "$EVIDENCE_DIR/file-delete-receipt.json")" = '2.0.0'
          test "$(jq -r '.verified' "$EVIDENCE_DIR/file-delete-receipt.json")" = true
          test "$(jq '.failures | length' "$EVIDENCE_DIR/file-delete-receipt.json")" = 0

      - name: Invalidate or resume invalidating Event caches with reset epoch
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
        run: |
          set -euo pipefail
          jq -n --arg resetRunId "$RESET_RUN_ID" --arg resetEpoch "$RESET_EPOCH" --arg schemaEpoch '2.0.0' --arg dataEpoch "$RESET_EPOCH" \
            '{resetRunId:$resetRunId,resetEpoch:$resetEpoch,schemaEpoch:$schemaEpoch,dataEpoch:$dataEpoch}' > "$EVIDENCE_DIR/cache-request.json"
          curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SPEED_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$EVIDENCE_DIR/cache-request.json" \
            "$SPEED_URL/api/internal/event-reset/cache" > "$EVIDENCE_DIR/cache-receipt.json"
          test "$(jq -r '.verified' "$EVIDENCE_DIR/cache-receipt.json")" = true
          test "$(jq -r '.resetRunId' "$EVIDENCE_DIR/cache-receipt.json")" = "$RESET_RUN_ID"
          test "$(jq -r '.resetEpoch' "$EVIDENCE_DIR/cache-receipt.json")" = "$RESET_EPOCH"
          test "$(jq -r '.schemaEpoch' "$EVIDENCE_DIR/cache-receipt.json")" = '2.0.0'
          test "$(jq -r '.dataEpoch' "$EVIDENCE_DIR/cache-receipt.json")" = "$RESET_EPOCH"
          test "$(jq '.failures | length' "$EVIDENCE_DIR/cache-receipt.json")" = 0

      - name: Verify reset and preserved hashes
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          Events__FileDeleteReceiptPath: ${{ runner.temp }}/event-reset/file-delete-receipt.json
        run: |
          set -euo pipefail
          dotnet run --project backend/src/Alife.DbMigrator/Alife.DbMigrator.csproj \
            --configuration Release --no-build -- \
            --Events:PurgeInstances=verify

      - name: Verify Event Durable Object storage is stably empty
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          EVENT_RESET_SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          EVENT_RESET_SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          EVENT_RESET_DO_TOKEN: ${{ secrets.EVENT_RESET_DO_TOKEN }}
          EVENT_RESET_RUN_ID: ${{ inputs.reset_run_id }}
          EVENT_RESET_FREEZE_EPOCH: ${{ inputs.freeze_epoch }}
          EVENT_RESET_CODE_SHA: ${{ inputs.code_sha }}
          EVENT_RESET_EVIDENCE_DIR: ${{ runner.temp }}/event-reset
          EVENT_RESET_DO_APPROVED_FINGERPRINT: ${{ inputs.approved_do_fingerprint }}
        run: |
          set -euo pipefail
          node cloudflare/speed-layer/scripts/reset-event-durable-objects.mjs verify

      - name: Restart backend in the frozen persistent data epoch
        if: always() && steps.stop_backend.outcome != 'skipped'
        shell: bash
        env:
          BACKEND_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          BACKEND_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          az functionapp start --name "$EVENT_RESET_FUNCTION_APP_NAME" --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" --only-show-errors
          for attempt in {1..30}; do
            state="$(az functionapp show --name "$EVENT_RESET_FUNCTION_APP_NAME" --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" --query state -o tsv)"
            backend="$(curl --silent --show-error -H "Authorization: Bearer $BACKEND_STATUS_TOKEN" "$BACKEND_STATUS_URL" || true)"
            if [ "$state" = Running ] && \
               [ "$(jq -r '.ready // false' <<<"$backend" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // false' <<<"$backend" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetEpoch // empty' <<<"$backend" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$backend" 2>/dev/null || true)" = "$RESET_EPOCH" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$backend" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.targetIdentityHash // empty' <<<"$backend" 2>/dev/null || true)" = "$EXPECTED_TARGET_IDENTITY_HASH" ] && \
               [ "$(jq -r '.activeMutations // -1' <<<"$backend" 2>/dev/null || true)" = 0 ] && \
               [ "$(jq -r '.scheduledJobsAcknowledged // false' <<<"$backend" 2>/dev/null || true)" = true ]; then
              restarted_utc="$(date -u +%FT%TZ)"
              mkdir -p "$EVIDENCE_DIR"
              jq -n \
                --arg functionApp "$EVENT_RESET_FUNCTION_APP_NAME" \
                --arg resourceGroup "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
                --arg resetEpoch "$RESET_EPOCH" \
                --arg targetIdentityHash "$EXPECTED_TARGET_IDENTITY_HASH" \
                --arg restartedUtc "$restarted_utc" \
                '{functionApp:$functionApp,resourceGroup:$resourceGroup,state:"Running",frozen:true,resetEpoch:$resetEpoch,dataEpoch:$resetEpoch,schemaEpoch:"2.0.0",targetIdentityHash:$targetIdentityHash,restartedUtc:$restartedUtc}' \
                > "$EVIDENCE_DIR/backend-restart-receipt.json"
              exit 0
            fi
            sleep 10
          done
          echo 'Backend did not restart in the exact frozen Event data epoch.'
          exit 1

      - name: Verify final 2.0 epoch across API, Speed Layer, and Images Worker
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          BACKEND_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          BACKEND_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          IMAGES_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          IMAGES_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          EXPECTED_TARGET_IDENTITY_HASH: ${{ steps.target_binding.outputs.target_identity_hash }}
        run: |
          set -euo pipefail
          backend="$(curl --retry 4 --retry-all-errors -fsS -H "Authorization: Bearer $BACKEND_STATUS_TOKEN" "$BACKEND_STATUS_URL")"
          speed="$(curl --retry 4 --retry-all-errors -fsS -H "Authorization: Bearer $SPEED_TOKEN" "$SPEED_URL/api/internal/event-reset/status")"
          images="$(curl --retry 4 --retry-all-errors -fsS -H "Authorization: Bearer $IMAGES_TOKEN" "$IMAGES_URL/api/admin/event-reset/status")"
          for payload in "$backend" "$speed" "$images"; do
            test "$(jq -r '.ready' <<<"$payload")" = true
            test "$(jq -r '.frozen' <<<"$payload")" = true
            test "$(jq -r '.resetEpoch' <<<"$payload")" = "$RESET_EPOCH"
            test "$(jq -r '.schemaEpoch' <<<"$payload")" = '2.0.0'
          done
          test "$(jq -r '.dataEpoch' <<<"$backend")" = "$RESET_EPOCH"
          test "$(jq -r '.targetIdentityHash' <<<"$backend")" = "$EXPECTED_TARGET_IDENTITY_HASH"
          test "$(jq -r '.dataEpoch' <<<"$speed")" = "$RESET_EPOCH"
          test "$(jq -r '.targetResource' <<<"$images")" = "${Events__TargetResource}"
          test "$(jq -r '.scheduledJobsAcknowledged' <<<"$backend")" = true
          test "$(jq -r '.activeMutations' <<<"$backend")" = 0

      - name: Record successful reset verification in the Function App
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
          RESET_EPOCH: ${{ inputs.freeze_epoch }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          CODE_SHA: ${{ inputs.code_sha }}
        run: |
          set -euo pipefail
          fingerprint="$(jq -r '.fingerprint' "$EVIDENCE_DIR/preview.json")"
          manifest_hash="$(jq -r '.fileManifestHash' "$EVIDENCE_DIR/verify.json")"
          verified_utc="$(date -u +%FT%TZ)"
          az functionapp config appsettings set \
            --name "$EVENT_RESET_FUNCTION_APP_NAME" \
            --resource-group "$EVENT_RESET_FUNCTION_RESOURCE_GROUP" \
            --settings \
              "EVENT_RESET_LAST_VERIFIED_STATE=verified" \
              "EVENT_RESET_LAST_VERIFIED_RUN_ID=$RESET_RUN_ID" \
              "EVENT_RESET_LAST_VERIFIED_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" \
              "EVENT_RESET_LAST_VERIFIED_CODE_SHA=$CODE_SHA" \
              "EVENT_RESET_LAST_VERIFIED_FINGERPRINT=$fingerprint" \
              "EVENT_RESET_LAST_VERIFIED_FILE_MANIFEST_HASH=$manifest_hash" \
              "EVENT_RESET_LAST_VERIFIED_BACKUP_REFERENCE=$BACKUP_REFERENCE" \
              "EVENT_RESET_LAST_VERIFIED_EPOCH=$RESET_EPOCH" \
              "EVENT_RESET_LAST_VERIFIED_SCHEMA_EPOCH=2.0.0" \
              "EVENT_RESET_LAST_VERIFIED_AT_UTC=$verified_utc" \
              "EVENT_RESET_ROLLBACK_HOLD=false" \
            --only-show-errors --output none
          jq -n \
            --arg resetRunId "$RESET_RUN_ID" \
            --arg evidenceRunId "$GITHUB_RUN_ID" \
            --arg codeSha "$CODE_SHA" \
            --arg fingerprint "$fingerprint" \
            --arg manifestHash "$manifest_hash" \
            --arg backupReference "$BACKUP_REFERENCE" \
            --arg resetEpoch "$RESET_EPOCH" \
            --arg verifiedUtc "$verified_utc" \
            '{resetRunId:$resetRunId,evidenceRunId:$evidenceRunId,codeSha:$codeSha,fingerprint:$fingerprint,manifestHash:$manifestHash,backupReference:$backupReference,resetEpoch:$resetEpoch,dataEpoch:$resetEpoch,schemaEpoch:"2.0.0",verifiedUtc:$verifiedUtc,rollbackHold:false,verified:true}' \
            > "$EVIDENCE_DIR/runtime-registration-receipt.json"

      - name: Verify protected reset health after marker registration
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        env:
          HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
          RESET_RUN_ID: ${{ inputs.reset_run_id }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          test "${#HEALTH_TOKEN}" -ge 32
          for attempt in {1..12}; do
            response="$(curl --silent --show-error -H "Authorization: Bearer $HEALTH_TOKEN" "$HEALTH_URL" || true)"
            if [ "$(jq -r '.healthy // false' <<<"$response" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetRunId // empty' <<<"$response" 2>/dev/null || true)" = "$RESET_RUN_ID" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$response" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$response" 2>/dev/null || true)" = '${{ inputs.freeze_epoch }}' ] && \
               [ "$(jq -r '.rollbackHold // true' <<<"$response" 2>/dev/null || true)" = false ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'The API did not report the exact verified reset state.'
          exit 1

      - name: Encrypt controlled evidence package
        id: encrypt_evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_KEY: ${{ secrets.EVENT_RESET_EVIDENCE_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f "$EVIDENCE_DIR/preview.json" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "${{ runner.temp }}/evidence.tgz" -C "$EVIDENCE_DIR" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "${{ runner.temp }}/evidence.tgz" \
            -out "${{ runner.temp }}/evidence.tgz.enc" \
            -pass env:EVIDENCE_KEY
          EVIDENCE_FILE="${{ runner.temp }}/evidence.tgz.enc" \
          HMAC_FILE="${{ runner.temp }}/evidence.tgz.enc.hmac" \
          node --input-type=module -e \
            'import {createHmac} from "node:crypto"; import fs from "node:fs"; const hmac=createHmac("sha256",process.env.EVIDENCE_KEY).update(fs.readFileSync(process.env.EVIDENCE_FILE)).digest("hex"); fs.writeFileSync(process.env.HMAC_FILE,hmac+"\n",{mode:0o600});'
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Upload encrypted evidence only
        if: always() && steps.encrypt_evidence.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-event-reset-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence.tgz.enc
            ${{ runner.temp }}/evidence.tgz.enc.hmac
          if-no-files-found: error
          retention-days: 35

      - name: Remove temporary SQL firewall rule
        if: always() && steps.sqlfw.outputs.rule_name != ''
        shell: bash
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.EVENT_RESET_SQL_RESOURCE_GROUP }}" \
            --server "${{ steps.sqlfw.outputs.server_name }}" \
            --name "${{ steps.sqlfw.outputs.rule_name }}" \
            --only-show-errors --output none || true
