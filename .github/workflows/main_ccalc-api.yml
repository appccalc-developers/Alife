name: Alife.API Migration and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main_ccalc-api.yml"
      - "backend/**"

permissions:
  actions: read
  id-token: write
  contents: read

concurrency:
  group: production-event-reset
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: production-event-final-release
    env:
      AZURE_FUNCTIONAPP_NAME: fapi-ccalc
      AZURE_RESOURCE_GROUP: ccalc
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PASSKEY_RP_ID: ccalc.live
      PASSKEY_ORIGIN: https://ccalc.live
      # These ten fictional members must not return after the separate cleanup.
      Seed__IncludeDemoMembers: 'false'
      FileAssets__ProviderCode: cloudflare-r2
      FileAssets__BucketName: ccalc
      FileAssets__ImageApiBaseUrl: https://images.ccalc.live
      FileAssets__UploadApiBaseUrl: https://images.ccalc.live
      FileAssets__PrivateFileBaseUrl: https://images.ccalc.live
      FileAssets__PrivateFileMaxLifetimeMinutes: '5'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Block deployment while rollback hold is active
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() {
            jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1
          }

          rollback_hold="$(setting EVENT_RESET_ROLLBACK_HOLD)"
          rollback_state="$(setting EVENT_RESET_ROLLBACK_STATE)"
          finalize_state="$(setting EVENT_RESET_FINALIZE_STATE)"
          if [ "${rollback_hold,,}" = true ] || [ -n "$rollback_state" ]; then
            echo 'Deployment is blocked because Event reset rollback hold is active.'
            exit 1
          fi
          if [ -n "$finalize_state" ] && [ "$finalize_state" != complete ]; then
            echo 'Deployment is blocked because recovery finalization is incomplete.'
            exit 1
          fi

      - name: Configure Function App runtime settings
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          LINE_LOGIN_CLIENT_ID: ${{ secrets.LINE_LOGIN_CLIENT_ID }}
          LINE_LOGIN_CLIENT_SECRET: ${{ secrets.LINE_LOGIN_CLIENT_SECRET }}
          LINE_LOGIN_REDIRECT_URI: ${{ secrets.LINE_LOGIN_REDIRECT_URI }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AUTHZ_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_AUTHZ_NAMESPACE_ID }}
          CLOUDFLARE_API_CACHE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_API_CACHE_NAMESPACE_ID }}
          CLOUDFLARE_SYNC_WORKER_BASE_URL: ${{ secrets.CLOUDFLARE_SYNC_WORKER_BASE_URL }}
          CLOUDFLARE_SYNC_API_TOKEN: ${{ secrets.CLOUDFLARE_SYNC_API_TOKEN }}
          ALPHA_STEPHEN_PASSKEY_BOOTSTRAP_CODE: ${{ secrets.ALPHA_STEPHEN_PASSKEY_BOOTSTRAP_CODE }}
          FILE_ADMIN_BACKFILL_SECRET: ${{ secrets.FILE_ADMIN_BACKFILL_SECRET }}
          FILE_ACCESS_SIGNING_SECRET: ${{ secrets.FILE_ACCESS_SIGNING_SECRET }}
          EVENT_RESET_FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          EVENT_RESET_FINALIZE_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DB_CONNECTION_STRING:-}" ]; then
            echo "Missing runtime DB connection string. Set DB_CONNECTION_STRING."
            exit 1
          fi

          if [ "${#ALPHA_STEPHEN_PASSKEY_BOOTSTRAP_CODE}" -lt 24 ]; then
            echo "Missing or invalid ALPHA_STEPHEN_PASSKEY_BOOTSTRAP_CODE; it must contain at least 24 characters."
            exit 1
          fi

          if [ "${#FILE_ADMIN_BACKFILL_SECRET}" -lt 32 ] || [ "${#FILE_ACCESS_SIGNING_SECRET}" -lt 32 ]; then
            echo "Missing file storage secrets. Configure FILE_ADMIN_BACKFILL_SECRET and FILE_ACCESS_SIGNING_SECRET in repository secrets before deployment."
            exit 1
          fi

          if [ "${#EVENT_RESET_FREEZE_STATUS_TOKEN}" -lt 32 ] || [ "${#EVENT_RESET_FINALIZE_HEALTH_TOKEN}" -lt 32 ]; then
            echo "Missing Event reset maintenance secrets."
            exit 1
          fi

          existing_settings="$(az functionapp config appsettings list \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --only-show-errors --output json)"
          existing_setting() {
            jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$existing_settings" | tail -n1
          }
          verified_data_epoch="$(existing_setting EVENT_RESET_LAST_VERIFIED_EPOCH)"
          event_data_epoch="$(existing_setting EVENT_DATA_EPOCH)"
          if [ -n "$verified_data_epoch" ]; then
            event_data_epoch="$verified_data_epoch"
          elif [ -z "$event_data_epoch" ]; then
            event_data_epoch='pre-event-2-reset'
          fi
          [[ "$event_data_epoch" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          event_write_mode="$(existing_setting EVENT_WRITE_MODE)"
          [ -n "$event_write_mode" ] || event_write_mode=open
          case "$event_write_mode" in open|frozen) ;; *) echo 'Invalid Event write mode.'; exit 1 ;; esac

          settings=(
            "EVENT_RUNTIME_ENVIRONMENT=production"
            "EVENT_SCHEMA_EPOCH=2.0.0"
            "EVENT_DATA_EPOCH=$event_data_epoch"
            "EVENT_WRITE_MODE=$event_write_mode"
            "Seed__IncludeDemoMembers=$Seed__IncludeDemoMembers"
            "FileAssets__ProviderCode=$FileAssets__ProviderCode"
            "FileAssets__BucketName=$FileAssets__BucketName"
            "FileAssets__ImageApiBaseUrl=$FileAssets__ImageApiBaseUrl"
            "FileAssets__UploadApiBaseUrl=$FileAssets__UploadApiBaseUrl"
            "FileAssets__PrivateFileBaseUrl=$FileAssets__PrivateFileBaseUrl"
            "FileAssets__PrivateFileMaxLifetimeMinutes=$FileAssets__PrivateFileMaxLifetimeMinutes"
            "FileAssets__ImageApiAdminSecret=$FILE_ADMIN_BACKFILL_SECRET"
            "FileAssets__PrivateFileSigningSecret=$FILE_ACCESS_SIGNING_SECRET"
            "EVENT_RESET_FREEZE_STATUS_TOKEN=$EVENT_RESET_FREEZE_STATUS_TOKEN"
            "EVENT_RESET_FINALIZE_HEALTH_TOKEN=$EVENT_RESET_FINALIZE_HEALTH_TOKEN"
            "ConnectionStrings__Default=$DB_CONNECTION_STRING"
            "Passkeys__Enabled=true"
            "Passkeys__RpId=$PASSKEY_RP_ID"
            "Passkeys__RpName=ALIFE"
            "Passkeys__Origins__0=$PASSKEY_ORIGIN"
            "AlphaLogin__Enabled=true"
            "AlphaLogin__PasskeyBootstrapCodes__Stephen=$ALPHA_STEPHEN_PASSKEY_BOOTSTRAP_CODE"
          )
          [ -n "${JWT_KEY:-}" ] && settings+=("Jwt__Key=$JWT_KEY")
          [ -n "${LINE_LOGIN_CLIENT_ID:-}" ] && settings+=("LineLogin__ClientId=$LINE_LOGIN_CLIENT_ID")
          [ -n "${LINE_LOGIN_CLIENT_SECRET:-}" ] && settings+=("LineLogin__ClientSecret=$LINE_LOGIN_CLIENT_SECRET")
          [ -n "${LINE_LOGIN_REDIRECT_URI:-}" ] && settings+=("LineLogin__RedirectUri=$LINE_LOGIN_REDIRECT_URI")
          [ -n "${FRONTEND_BASE_URL:-}" ] && settings+=("Frontend__BaseUrl=$FRONTEND_BASE_URL")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && settings+=("Cloudflare__AccountId=$CLOUDFLARE_ACCOUNT_ID")
          [ -n "${CLOUDFLARE_ZONE_ID:-}" ] && settings+=("Cloudflare__ZoneId=$CLOUDFLARE_ZONE_ID")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && settings+=("Cloudflare__ApiToken=$CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_AUTHZ_NAMESPACE_ID:-}" ] && settings+=("Cloudflare__AuthzNamespaceId=$CLOUDFLARE_AUTHZ_NAMESPACE_ID")
          [ -n "${CLOUDFLARE_API_CACHE_NAMESPACE_ID:-}" ] && settings+=("Cloudflare__ApiCacheNamespaceId=$CLOUDFLARE_API_CACHE_NAMESPACE_ID")
          [ -n "${CLOUDFLARE_SYNC_WORKER_BASE_URL:-}" ] && settings+=("Cloudflare__SyncWorkerBaseUrl=$CLOUDFLARE_SYNC_WORKER_BASE_URL")
          [ -n "${CLOUDFLARE_SYNC_API_TOKEN:-}" ] && settings+=("Cloudflare__SyncApiToken=$CLOUDFLARE_SYNC_API_TOKEN")

          az functionapp config appsettings set \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings "${settings[@]}" \
            --only-show-errors \
            --output none

      - name: Resolve SQL server and runner IP
        id: sqlfw
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          get_runner_ip() {
            local url
            for url in \
              "https://api.ipify.org" \
              "https://ifconfig.me/ip" \
              "https://ipv4.icanhazip.com"
            do
              ip="$(curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL "$url" | tr -d '[:space:]' || true)"
              if [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
                echo "$ip"
                return 0
              fi
            done
            return 1
          }

          runner_ip="$(get_runner_ip)"
          if [ -z "${runner_ip:-}" ]; then
            echo "Could not determine GitHub runner public IP."
            exit 1
          fi

          server_entry="$(echo "$DB_CONNECTION_STRING" | tr ';' '\n' | grep -E -i '^(server|data source)=' | head -n1 | cut -d'=' -f2- || true)"
          if [ -z "$server_entry" ]; then
            echo "Could not parse SQL server from DB_CONNECTION_STRING."
            exit 1
          fi

          server_entry="${server_entry#tcp:}"
          server_fqdn="${server_entry%%,*}"
          server_name="${server_fqdn%%.*}"

          if [ -z "$server_name" ]; then
            echo "Could not derive Azure SQL server name from '$server_fqdn'."
            exit 1
          fi

          rule_name="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          echo "server_name=$server_name" >> "$GITHUB_OUTPUT"
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Allow Function App outbound IPs in Azure SQL firewall
        shell: bash
        run: |
          set -euo pipefail

          outbound_ips="$(az functionapp show \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query outboundIpAddresses \
            -o tsv)"

          IFS=',' read -ra ips <<< "$outbound_ips"
          for ip in "${ips[@]}"; do
            ip="$(echo "$ip" | xargs)"
            [ -z "$ip" ] && continue
            rule_name="func-${{ env.AZURE_FUNCTIONAPP_NAME }}-${ip//./-}"
            az sql server firewall-rule create \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --server "${{ steps.sqlfw.outputs.server_name }}" \
              --name "$rule_name" \
              --start-ip-address "$ip" \
              --end-ip-address "$ip" \
              --only-show-errors \
              --output none
          done

      - name: Allow GitHub runner IP in Azure SQL firewall
        shell: bash
        run: |
          set -euo pipefail
          az sql server firewall-rule create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ steps.sqlfw.outputs.server_name }}" \
            --name "${{ steps.sqlfw.outputs.rule_name }}" \
            --start-ip-address "${{ steps.sqlfw.outputs.runner_ip }}" \
            --end-ip-address "${{ steps.sqlfw.outputs.runner_ip }}" \
            --only-show-errors

      - name: Wait for firewall propagation
        shell: bash
        run: sleep 30

      - name: Inspect whether the Event 2.0 destructive migration is pending
        id: event2-gate
        working-directory: ./backend/src/Alife.DbMigrator
        shell: bash
        env:
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
          Events__OutputDirectory: ${{ runner.temp }}/event2-migration-gate
        run: |
          set -euo pipefail
          dotnet run --configuration Release -- --Events:Event2MigrationGate=inspect
          gate_file="${{ runner.temp }}/event2-migration-gate/event2-migration-gate.json"
          known="$(jq -r '.known' "$gate_file")"
          applied="$(jq -r '.applied' "$gate_file")"
          pending="$(jq -r '.pending' "$gate_file")"
          test "$known" = true || test "$known" = false
          test "$applied" = true || test "$applied" = false
          test "$pending" = true || test "$pending" = false
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Select preparation, final-release or normal migration mode
        id: event2-release
        shell: bash
        env:
          EVENT2_FINAL_RELEASE_AUTHORIZED: ${{ vars.EVENT2_FINAL_RELEASE_AUTHORIZED }}
          MIGRATION_KNOWN: ${{ steps.event2-gate.outputs.known }}
          MIGRATION_APPLIED: ${{ steps.event2-gate.outputs.applied }}
          MIGRATION_PENDING: ${{ steps.event2-gate.outputs.pending }}
        run: |
          set -euo pipefail
          # This checkout is the final 2.0 runtime and cannot serve as the
          # legacy-preserving preparation release. While the destructive migration
          # is pending, an absent/false protected authorization blocks deployment.
          # The protected environment switches authorization to true only after an
          # independently deployed preparation release and the reset verify marker.
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          final_state="$(setting EVENT_RESET_FINAL_RELEASE_STATE)"
          phase=normal
          if [ "$MIGRATION_PENDING" = true ]; then
            if [ "$EVENT2_FINAL_RELEASE_AUTHORIZED" = true ]; then
              phase=final
            else
              phase=preparation-required
            fi
          elif [ "$MIGRATION_KNOWN" = true ] && [ "$MIGRATION_APPLIED" = true ] && [ "$final_state" != complete ]; then
            test "$EVENT2_FINAL_RELEASE_AUTHORIZED" = true
            phase=resume-final
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Event 2.0 deployment phase: $phase"

      - name: Refuse to replace the independent preparation release with final code
        if: steps.event2-release.outputs.phase == 'preparation-required'
        shell: bash
        env:
          EXPECTED_PREPARATION_SHA: ${{ vars.EVENT2_PREPARATION_RELEASE_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          preparation_state="$(setting EVENT_RESET_PREPARATION_STATE)"
          preparation_sha="$(setting EVENT_RESET_PREPARATION_SHA)"
          preparation_run_id="$(setting EVENT_RESET_PREPARATION_RUN_ID)"
          legacy_preserved="$(setting EVENT_RESET_PREPARATION_LEGACY_RUNTIME_PRESERVED)"

          if [ "$preparation_state" != verified ] || [ "${legacy_preserved,,}" != true ] || \
             ! [[ "$preparation_sha" =~ ^[0-9a-f]{40}$ ]] || \
             ! [[ "$preparation_run_id" =~ ^[0-9]+$ ]] || \
             ! [[ "$EXPECTED_PREPARATION_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$preparation_sha" != "$EXPECTED_PREPARATION_SHA" ] || \
             [ "$preparation_sha" = "$GITHUB_SHA" ]; then
            echo 'A distinct, legacy-preserving Event reset preparation release has not been verified.'
            echo 'Deploy that reviewed preparation artifact through its protected release first and record its SHA/run marker.'
            exit 1
          fi

          preparation_run="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$preparation_run_id")"
          test "$(jq -r '.status' <<<"$preparation_run")" = completed
          test "$(jq -r '.conclusion' <<<"$preparation_run")" = success
          test "$(jq -r '.head_sha' <<<"$preparation_run")" = "$preparation_sha"

          echo 'The independent preparation release is verified. This final-runtime checkout will remain undeployed until protected final-release authorization is enabled after reset verify.'
          exit 1

      - name: Require verified reset marker for the final destructive migration
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          RESET_HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          RESET_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RELEASE_PHASE: ${{ steps.event2-release.outputs.phase }}
          EXPECTED_PREPARATION_SHA: ${{ vars.EVENT2_PREPARATION_RELEASE_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RESET_HEALTH_URL"
          test -n "$FREEZE_STATUS_URL"
          test "${#RESET_HEALTH_TOKEN}" -ge 32
          test "${#FREEZE_STATUS_TOKEN}" -ge 32
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          test "$(setting EVENT_RESET_PREPARATION_STATE)" = verified
          test "$(setting EVENT_RESET_PREPARATION_LEGACY_RUNTIME_PRESERVED)" = true
          preparation_sha="$(setting EVENT_RESET_PREPARATION_SHA)"
          preparation_run_id="$(setting EVENT_RESET_PREPARATION_RUN_ID)"
          [[ "$EXPECTED_PREPARATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$preparation_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$preparation_run_id" =~ ^[0-9]+$ ]]
          test "$preparation_sha" = "$EXPECTED_PREPARATION_SHA"
          test "$preparation_sha" != "$GITHUB_SHA"
          preparation_run="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$preparation_run_id")"
          test "$(jq -r '.status' <<<"$preparation_run")" = completed
          test "$(jq -r '.conclusion' <<<"$preparation_run")" = success
          test "$(jq -r '.head_sha' <<<"$preparation_run")" = "$preparation_sha"
          test "$(setting EVENT_RESET_ROLLBACK_HOLD)" = false
          test "$(setting EVENT_RESET_LAST_VERIFIED_STATE)" = verified
          test "$(setting EVENT_RESET_LAST_VERIFIED_SCHEMA_EPOCH)" = '2.0.0'
          test "$(setting EVENT_RESET_LAST_VERIFIED_CODE_SHA)" = "$GITHUB_SHA"
          reset_epoch="$(setting EVENT_RESET_LAST_VERIFIED_EPOCH)"
          reset_run_id="$(setting EVENT_RESET_LAST_VERIFIED_RUN_ID)"
          evidence_run_id="$(setting EVENT_RESET_LAST_VERIFIED_EVIDENCE_RUN_ID)"
          fingerprint="$(setting EVENT_RESET_LAST_VERIFIED_FINGERPRINT)"
          manifest_hash="$(setting EVENT_RESET_LAST_VERIFIED_FILE_MANIFEST_HASH)"
          backup_reference="$(setting EVENT_RESET_LAST_VERIFIED_BACKUP_REFERENCE)"
          [[ "$reset_run_id" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$evidence_run_id" =~ ^[0-9]+$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$reset_epoch" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          test "$(setting EVENT_DATA_EPOCH)" = "$reset_epoch"
          case "$backup_reference" in
            /subscriptions/*/resourceGroups/*/providers/Microsoft.Sql/servers/*/databases/*) ;;
            *) exit 1 ;;
          esac
          health=''
          for attempt in {1..12}; do
            health="$(curl --silent --show-error -H "Authorization: Bearer $RESET_HEALTH_TOKEN" "$RESET_HEALTH_URL" || true)"
            [ "$(jq -r '.healthy // false' <<<"$health" 2>/dev/null || true)" = true ] && break
            sleep 10
          done
          test "$(jq -r '.healthy' <<<"$health")" = true
          test "$(jq -r '.schemaEpoch' <<<"$health")" = '2.0.0'
          test "$(jq -r '.dataEpoch' <<<"$health")" = "$reset_epoch"
          test "$(jq -r '.resetRunId' <<<"$health")" = "$reset_run_id"
          test "$(jq -r '.rollbackHold' <<<"$health")" = false
          test "$(jq -r '.eventRootCount' <<<"$health")" = 0
          test "$(jq -r '.eventInstanceRowCount' <<<"$health")" = 0
          test "$(jq -r '.finalizationBlocksDeployment' <<<"$health")" = false
          if [ "$RELEASE_PHASE" = final ]; then
            test "$(jq -r '.destructiveMigrationApplied' <<<"$health")" = false
            test "$(jq -r '.finalReleaseBlocksDeployment' <<<"$health")" = false
          else
            test "$(jq -r '.destructiveMigrationApplied' <<<"$health")" = true
            test "$(jq -r '.finalReleaseBlocksDeployment' <<<"$health")" = true
          fi

          freeze_status="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FREEZE_STATUS_TOKEN" "$FREEZE_STATUS_URL")"
          test "$(jq -r '.configurationValid' <<<"$freeze_status")" = true
          test "$(jq -r '.frozen' <<<"$freeze_status")" = true
          test "$(jq -r '.resetEpoch' <<<"$freeze_status")" = "$reset_epoch"
          test "$(jq -r '.schemaEpoch' <<<"$freeze_status")" = '2.0.0'
          test "$(jq -r '.dataEpoch' <<<"$freeze_status")" = "$reset_epoch"
          test "$(jq -r '.activeMutations' <<<"$freeze_status")" = 0
          test "$(jq -r '.scheduledJobsAcknowledged' <<<"$freeze_status")" = true

      - name: Reconfirm rollback hold immediately before migrations
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          rollback_hold="$(setting EVENT_RESET_ROLLBACK_HOLD)"
          test "${rollback_hold,,}" != true
          test -z "$(setting EVENT_RESET_ROLLBACK_STATE)"

      - name: Run Alife.DbMigrator
        if: steps.event2-release.outputs.phase != 'preparation-required'
        working-directory: ./backend/src/Alife.DbMigrator
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
          RELEASE_PHASE: ${{ steps.event2-release.outputs.phase }}
        run: |
          set -euo pipefail
          migrator_arguments=()
          if [ "$RELEASE_PHASE" = final ] || [ "$RELEASE_PHASE" = resume-final ]; then
            settings="$(az functionapp config appsettings list \
              --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --only-show-errors --output json)"
            reset_run_id="$(jq -r '.[] | select(.name == "EVENT_RESET_LAST_VERIFIED_RUN_ID") | .value' <<<"$settings" | tail -n1)"
            [[ "$reset_run_id" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
            migrator_arguments+=(
              '--Events:AllowEvent2DestructiveMigration=true'
              "--Events:VerifiedResetRunId=$reset_run_id"
            )
          fi
          for attempt in 1 2 3; do
            echo "Running migrator (attempt $attempt/3)..."
            if dotnet run --configuration Release -- "${migrator_arguments[@]}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Migrator failed; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "Migrator failed after 3 attempts."
          exit 1

      - name: Build Alife.API
        working-directory: ./backend/src/Alife.Api
        run: dotnet build --configuration Release

      - name: Publish Alife.API
        working-directory: ./backend/src/Alife.Api
        run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ${{ github.workspace }}/publish

      - name: Deploy Alife.API to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ github.workspace }}/publish

      - name: Verify final Event 2.0 code while backend writes remain frozen
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          RESET_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          reset_epoch="$(setting EVENT_RESET_LAST_VERIFIED_EPOCH)"
          reset_run_id="$(setting EVENT_RESET_LAST_VERIFIED_RUN_ID)"
          for attempt in {1..18}; do
            freeze_status="$(curl --silent --show-error -H "Authorization: Bearer $FREEZE_STATUS_TOKEN" "$FREEZE_STATUS_URL" || true)"
            health="$(curl --silent --show-error -H "Authorization: Bearer $RESET_HEALTH_TOKEN" "$RESET_HEALTH_URL" || true)"
            if [ "$(jq -r '.configurationValid // false' <<<"$freeze_status" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // false' <<<"$freeze_status" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" = "$reset_epoch" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" = "$reset_epoch" ] && \
               [ "$(jq -r '.healthy // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.resetRunId // empty' <<<"$health" 2>/dev/null || true)" = "$reset_run_id" ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$health" 2>/dev/null || true)" = "$reset_epoch" ] && \
               [ "$(jq -r '.destructiveMigrationApplied // false' <<<"$health" 2>/dev/null || true)" = true ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Final Event 2.0 API did not become healthy while the reset freeze remained active.'
          exit 1

      - name: Setup Node.js for the protected final release
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloudflare/alife-app/package-lock.json
            cloudflare/speed-layer/package-lock.json

      - name: Build the reviewed frontend and Speed Layer for unfreeze
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          CLOUDFLARE_API_CACHE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_API_CACHE_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          npm ci --prefix cloudflare/alife-app
          npm run generate:public-home-bootstrap --prefix cloudflare/alife-app
          npm run build --prefix cloudflare/alife-app
          npm ci --prefix cloudflare/speed-layer
          npm run prepare:deploy-config --prefix cloudflare/speed-layer
          settings="$(az functionapp config appsettings list --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output json)"
          data_epoch="$(jq -r '.[] | select(.name == "EVENT_RESET_LAST_VERIFIED_EPOCH") | .value' <<<"$settings" | tail -n1)"
          test "$(jq -r '.[] | select(.name == "EVENT_DATA_EPOCH") | .value' <<<"$settings" | tail -n1)" = "$data_epoch"
          [[ "$data_epoch" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          EVENT_DATA_EPOCH="$data_epoch" node --input-type=module -e \
            'import fs from "node:fs"; const p="cloudflare/speed-layer/.wrangler.deploy.jsonc"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.vars={...c.vars,EVENT_DATA_EPOCH:process.env.EVENT_DATA_EPOCH,EVENT_WRITE_MODE:"open"}; delete c.vars.EVENT_WRITE_FREEZE_EPOCH; delete c.vars.EVENT_RESET_DO_APPROVED_FINGERPRINT; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'

      - name: Open Images API and Speed Layer from the reviewed final code
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CACHE_SYNC_API_TOKEN: ${{ secrets.CACHE_SYNC_API_TOKEN }}
          EVENT_RESET_DO_TOKEN: ${{ secrets.EVENT_RESET_DO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"
          test -n "$CACHE_SYNC_API_TOKEN"
          test "${#EVENT_RESET_DO_TOKEN}" -ge 32
          test "${#EVENT_RESET_DO_TOKEN}" -le 4096
          test "$EVENT_RESET_DO_TOKEN" != "$CACHE_SYNC_API_TOKEN"
          npx wrangler@4.88.0 deploy --config cloudflare/images-api/wrangler.toml
          node -e 'process.stdout.write(`GEMINI_API_KEY=${process.env.GEMINI_API_KEY}\nCACHE_SYNC_API_TOKEN=${process.env.CACHE_SYNC_API_TOKEN}\nEVENT_RESET_DO_TOKEN=${process.env.EVENT_RESET_DO_TOKEN}\n`)' > cloudflare/speed-layer/.event2-final.vars
          npx wrangler@4.88.0 deploy --config cloudflare/speed-layer/.wrangler.deploy.jsonc \
            --secrets-file cloudflare/speed-layer/.event2-final.vars
          rm -f cloudflare/speed-layer/.event2-final.vars

      - name: Verify Cloudflare Event writers are open on schema 2.0
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
          IMAGES_URL: ${{ vars.EVENT_RESET_FILE_API_URL }}
          IMAGES_TOKEN: ${{ secrets.EVENT_RESET_FILE_API_TOKEN }}
          TARGET_RESOURCE: ${{ vars.EVENT_RESET_SQL_RESOURCE_ID }}
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output json)"
          data_epoch="$(jq -r '.[] | select(.name == "EVENT_RESET_LAST_VERIFIED_EPOCH") | .value' <<<"$settings" | tail -n1)"
          for attempt in {1..18}; do
            speed="$(curl --silent --show-error -H "Authorization: Bearer $SPEED_TOKEN" \
              "$SPEED_URL/api/internal/event-reset/status" || true)"
            images="$(curl --silent --show-error -H "Authorization: Bearer $IMAGES_TOKEN" \
              "$IMAGES_URL/api/admin/event-reset/status" || true)"
            if [ "$(jq -r '.frozen // true' <<<"$speed" 2>/dev/null || true)" = false ] && \
               [ -z "$(jq -r '.resetEpoch // empty' <<<"$speed" 2>/dev/null || true)" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$speed" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$speed" 2>/dev/null || true)" = "$data_epoch" ] && \
               [ "$(jq -r '.frozen // true' <<<"$images" 2>/dev/null || true)" = false ] && \
               [ -z "$(jq -r '.resetEpoch // empty' <<<"$images" 2>/dev/null || true)" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$images" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.targetResource // empty' <<<"$images" 2>/dev/null || true)" = "$TARGET_RESOURCE" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare Event writers did not enter the open Event 2.0 state.'
          exit 1

      - name: Open backend Event writes and enter final verification
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        run: |
          set -euo pipefail
          completed_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              'EVENT_WRITE_MODE=open' \
              'EVENT_WRITE_FREEZE_EPOCH=' \
              'EVENT_RESET_FINAL_RELEASE_STATE=verifying' \
              "EVENT_RESET_FINAL_RELEASE_SHA=$GITHUB_SHA" \
              "EVENT_RESET_FINAL_RELEASE_RUN_ID=$GITHUB_RUN_ID" \
              "EVENT_RESET_FINAL_RELEASE_STARTED_AT_UTC=$completed_utc" \
            --only-show-errors --output none

      - name: Verify the final release is open and healthy before committing its marker
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          RESET_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
        run: |
          set -euo pipefail
          settings="$(az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --only-show-errors --output json)"
          setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
          reset_run_id="$(setting EVENT_RESET_LAST_VERIFIED_RUN_ID)"
          test "$(setting EVENT_RESET_FINAL_RELEASE_STATE)" = verifying
          test "$(setting EVENT_RESET_FINAL_RELEASE_SHA)" = "$GITHUB_SHA"
          test "$(setting EVENT_RESET_ROLLBACK_HOLD)" = false
          for attempt in {1..18}; do
            freeze_status="$(curl --silent --show-error -H "Authorization: Bearer $FREEZE_STATUS_TOKEN" "$FREEZE_STATUS_URL" || true)"
            health="$(curl --silent --show-error -H "Authorization: Bearer $RESET_HEALTH_TOKEN" "$RESET_HEALTH_URL" || true)"
            if [ "$(jq -r '.configurationValid // false' <<<"$freeze_status" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // true' <<<"$freeze_status" 2>/dev/null || true)" = false ] && \
               [ -z "$(jq -r '.resetEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" ] && \
               [ "$(jq -r '.schemaEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" = "$(setting EVENT_RESET_LAST_VERIFIED_EPOCH)" ] && \
               [ "$(jq -r '.healthy // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.dataEpoch // empty' <<<"$health" 2>/dev/null || true)" = "$(setting EVENT_RESET_LAST_VERIFIED_EPOCH)" ] && \
               [ "$(jq -r '.resetRunId // empty' <<<"$health" 2>/dev/null || true)" = "$reset_run_id" ] && \
               [ "$(jq -r '.destructiveMigrationApplied // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.finalReleaseBlocksDeployment // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.rollbackHold // true' <<<"$health" 2>/dev/null || true)" = false ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Final Event 2.0 release did not reach the open verified state.'
          exit 1

      - name: Commit final-release completion marker
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        run: |
          set -euo pipefail
          completed_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              'EVENT_RESET_PREPARATION_STATE=complete' \
              'EVENT_RESET_FINAL_RELEASE_STATE=complete' \
              "EVENT_RESET_FINAL_RELEASE_COMPLETED_AT_UTC=$completed_utc" \
            --only-show-errors --output none

      - name: Verify the committed final-release marker remains healthy
        if: steps.event2-release.outputs.phase == 'final' || steps.event2-release.outputs.phase == 'resume-final'
        shell: bash
        env:
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          RESET_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            settings="$(az functionapp config appsettings list \
              --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --only-show-errors --output json)"
            setting() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$settings" | tail -n1; }
            freeze_status="$(curl --silent --show-error -H "Authorization: Bearer $FREEZE_STATUS_TOKEN" "$FREEZE_STATUS_URL" || true)"
            health="$(curl --silent --show-error -H "Authorization: Bearer $RESET_HEALTH_TOKEN" "$RESET_HEALTH_URL" || true)"
            if [ "$(setting EVENT_RESET_FINAL_RELEASE_STATE)" = complete ] && \
               [ "$(setting EVENT_RESET_FINAL_RELEASE_SHA)" = "$GITHUB_SHA" ] && \
               [ "$(jq -r '.configurationValid // false' <<<"$freeze_status" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.frozen // true' <<<"$freeze_status" 2>/dev/null || true)" = false ] && \
               [ -z "$(jq -r '.resetEpoch // empty' <<<"$freeze_status" 2>/dev/null || true)" ] && \
               [ "$(jq -r '.healthy // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.destructiveMigrationApplied // false' <<<"$health" 2>/dev/null || true)" = true ] && \
               [ "$(jq -r '.finalReleaseBlocksDeployment // true' <<<"$health" 2>/dev/null || true)" = false ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'The final release marker did not return to the healthy open state.'
          exit 1

      - name: Remove GitHub runner IP from Azure SQL firewall
        if: always()
        shell: bash
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ steps.sqlfw.outputs.server_name }}" \
            --name "${{ steps.sqlfw.outputs.rule_name }}" \
            --only-show-errors || true
