name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.html"
      - ".github/workflows/deploy-cloudflare-worker.yml"
      - "cloudflare/alife-app/**"
      - "cloudflare/speed-layer/**"

permissions:
  contents: read

concurrency:
  group: production-event-reset
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CACHE_SYNC_API_TOKEN: ${{ secrets.CACHE_SYNC_API_TOKEN }}
      CLOUDFLARE_API_CACHE_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_API_CACHE_NAMESPACE_ID }}
      API_PROXY_TARGET: ${{ secrets.API_PROXY_TARGET }}
      VITE_YOUVERSION_APP_KEY: ${{ secrets.VITE_YOUVERSION_APP_KEY }}
      VITE_API_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloudflare/alife-app/package-lock.json
            cloudflare/speed-layer/package-lock.json

      - name: Refuse a normal deploy during Event reset, rollback or finalization
        shell: bash
        env:
          FREEZE_STATUS_URL: ${{ vars.EVENT_RESET_FREEZE_STATUS_URL }}
          FREEZE_STATUS_TOKEN: ${{ secrets.EVENT_RESET_FREEZE_STATUS_TOKEN }}
          RESET_HEALTH_URL: ${{ vars.EVENT_RESET_FINALIZE_HEALTH_URL }}
          RESET_HEALTH_TOKEN: ${{ secrets.EVENT_RESET_FINALIZE_HEALTH_TOKEN }}
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FREEZE_STATUS_URL"
          test -n "$RESET_HEALTH_URL"
          test -n "$SPEED_URL"
          test "${#FREEZE_STATUS_TOKEN}" -ge 32
          test "${#RESET_HEALTH_TOKEN}" -ge 32
          test "${#SPEED_TOKEN}" -ge 32

          freeze_status="$(curl --retry 4 --retry-all-errors --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $FREEZE_STATUS_TOKEN" "$FREEZE_STATUS_URL")"
          test "$(jq -r '.configurationValid' <<<"$freeze_status")" = true
          test "$(jq -r '.schemaEpoch' <<<"$freeze_status")" = '2.0.0'
          data_epoch="$(jq -r '.dataEpoch // empty' <<<"$freeze_status")"
          [[ "$data_epoch" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          test "$(jq -r '.frozen' <<<"$freeze_status")" = false
          test -z "$(jq -r '.resetEpoch // empty' <<<"$freeze_status")"

          health_file="$RUNNER_TEMP/speed-event-reset-health.json"
          health_code="$(curl --retry 4 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer $RESET_HEALTH_TOKEN" \
            -o "$health_file" -w '%{http_code}' "$RESET_HEALTH_URL")"
          if [ "$health_code" != 200 ] && [ "$health_code" != 503 ]; then
            echo "Event reset health returned unexpected HTTP status $health_code."
            exit 1
          fi
          jq -e 'type == "object" and has("resetRunId") and has("rollbackHold") and has("verifiedStateConfigured") and has("inventoryRecognized") and has("destructiveMigrationApplied") and has("finalizationBlocksDeployment") and has("finalReleaseBlocksDeployment")' "$health_file" >/dev/null
          test "$(jq -r '.schemaEpoch' "$health_file")" = '2.0.0'
          test "$(jq -r '.finalizationBlocksDeployment' "$health_file")" = false
          test "$(jq -r '.finalReleaseBlocksDeployment' "$health_file")" = false
          test "$(jq -r '.inventoryRecognized' "$health_file")" = true
          reset_run_id="$(jq -r '.resetRunId // empty' "$health_file")"
          pre_reset=false
          if [ -z "$reset_run_id" ]; then
            test "$(jq -r '.destructiveMigrationApplied' "$health_file")" = false
            pre_reset=true
          else
            test "$(jq -r '.verifiedStateConfigured' "$health_file")" = true
            test "$(jq -r '.rollbackHold' "$health_file")" = false
            test "$(jq -r '.destructiveMigrationApplied' "$health_file")" = true
            test "$(jq -r '.dataEpoch' "$health_file")" = "$data_epoch"
          fi

          speed_file="$RUNNER_TEMP/current-speed-reset-status.json"
          speed_code="$(curl --retry 4 --retry-all-errors --silent --show-error \
            -H "Authorization: Bearer $SPEED_TOKEN" \
            -o "$speed_file" -w '%{http_code}' "$SPEED_URL/api/internal/event-reset/status")"
          if [ "$speed_code" = 200 ] || [ "$speed_code" = 503 ]; then
            test "$(jq -r '.schemaEpoch' "$speed_file")" = '2.0.0'
            test "$(jq -r '.dataEpoch' "$speed_file")" = "$data_epoch"
            test "$(jq -r '.frozen' "$speed_file")" = false
            test -z "$(jq -r '.resetEpoch // empty' "$speed_file")"
          elif [ "$pre_reset" != true ]; then
            echo "Speed Layer reset status returned unexpected HTTP status $speed_code."
            exit 1
          else
            echo 'Allowing the one-time pre-reset Speed Layer status bootstrap.'
          fi
          echo "EVENT_DATA_EPOCH=$data_epoch" >> "$GITHUB_ENV"

      - name: Install Frontend dependencies
        working-directory: ./cloudflare/alife-app
        run: npm ci

      - name: Refresh public homepage bootstrap
        working-directory: ./cloudflare/alife-app
        run: npm run generate:public-home-bootstrap

      - name: Build Frontend
        working-directory: ./cloudflare/alife-app
        run: npm run build

      - name: Test frontend route chunk recovery
        working-directory: ./cloudflare/alife-app
        run: npm run test:route-chunk-recovery

      - name: Install Speed-layer dependencies
        working-directory: ./cloudflare/speed-layer
        run: npm ci

      - name: Prepare Worker secrets
        working-directory: ./cloudflare/speed-layer
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing GitHub secret: GEMINI_API_KEY"
            exit 1
          fi

          if [ -z "${CACHE_SYNC_API_TOKEN:-}" ]; then
            echo "Missing GitHub secret: CACHE_SYNC_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_CACHE_NAMESPACE_ID:-}" ]; then
            echo "Missing GitHub secret: CLOUDFLARE_API_CACHE_NAMESPACE_ID"
            exit 1
          fi

          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'CACHE_SYNC_API_TOKEN=%s\n' "$CACHE_SYNC_API_TOKEN"
          } > .dev.vars

      - name: Test Worker speed layer
        working-directory: ./cloudflare/speed-layer
        run: npm test

      - name: Prepare Worker deployment config
        working-directory: ./cloudflare/speed-layer
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:deploy-config
          node --input-type=module -e \
            'import fs from "node:fs"; const p=".wrangler.deploy.jsonc"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.vars={...c.vars,EVENT_DATA_EPOCH:process.env.EVENT_DATA_EPOCH,EVENT_WRITE_MODE:"open"}; delete c.vars.EVENT_WRITE_FREEZE_EPOCH; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'

      - name: Deploy Worker
        working-directory: ./cloudflare/speed-layer
        run: npx wrangler deploy --config .wrangler.deploy.jsonc --secrets-file .dev.vars

      - name: Verify Speed Layer remains open after normal deployment
        shell: bash
        env:
          SPEED_URL: ${{ vars.EVENT_RESET_SPEED_URL }}
          SPEED_TOKEN: ${{ secrets.EVENT_RESET_SPEED_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status_file="$RUNNER_TEMP/deployed-speed-reset-status.json"
            status_code="$(curl --silent --show-error -H "Authorization: Bearer $SPEED_TOKEN" \
              -o "$status_file" -w '%{http_code}' "$SPEED_URL/api/internal/event-reset/status" || true)"
            if [ "$status_code" = 503 ] && \
               [ "$(jq -r '.frozen // true' "$status_file" 2>/dev/null || true)" = false ] && \
               [ -z "$(jq -r '.resetEpoch // empty' "$status_file" 2>/dev/null || true)" ] && \
               [ "$(jq -r '.schemaEpoch // empty' "$status_file" 2>/dev/null || true)" = '2.0.0' ] && \
               [ "$(jq -r '.dataEpoch // empty' "$status_file" 2>/dev/null || true)" = "$EVENT_DATA_EPOCH" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Speed Layer did not return to the expected open Event 2.0 state.'
          exit 1

      - name: Warm public page cache
        working-directory: ./cloudflare/speed-layer
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CACHE_SYNC_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"paths":["/api/pages/public"]}' \
            "https://ccalc.live/api/internal/cache/invalidate" > /dev/null

          public_pages="$(curl --fail --silent --show-error --retry 3 \
            "https://ccalc.live/api/pages/public")"
          while IFS= read -r page_id; do
            [ -z "$page_id" ] && continue
            curl --fail --silent --show-error --retry 3 \
              "https://ccalc.live/api/pages/${page_id}" > /dev/null
          done < <(jq -r 'if type == "array" then .[] | .id // empty else empty end' <<< "$public_pages")

      - name: Verify deployed frontend routes and assets
        working-directory: ./cloudflare/speed-layer
        shell: bash
        run: |
          set -euo pipefail

          expected_entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' ../alife-app/dist/index.html | head -n 1 || true)"
          if [ -z "$expected_entry" ]; then
            echo "Could not identify the built frontend entry asset."
            exit 1
          fi

          verify_route() {
            local route="$1"
            local attempt="$2"
            local separator='?'
            if [[ "$route" == *\?* ]]; then
              separator='&'
            fi

            local deployed_html
            deployed_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://ccalc.live${route}${separator}deployment-check=${GITHUB_RUN_ID}-${attempt}")"
            grep -Fq "$expected_entry" <<< "$deployed_html"
          }

          routes=("/" "/onboarding")
          deployment_ready=false
          for attempt in {1..12}; do
            all_routes_ready=true
            for route in "${routes[@]}"; do
              if ! verify_route "$route" "$attempt"; then
                echo "Attempt ${attempt}/12 did not expose ${expected_entry} at ${route}."
                all_routes_ready=false
              fi
            done

            if [[ "$all_routes_ready" == true ]]; then
              deployment_ready=true
              break
            fi

            sleep 10
          done

          if [[ "$deployment_ready" != true ]]; then
            echo "Deployment did not expose the expected frontend entry on every checked route: $expected_entry"
            exit 1
          fi

          while IFS= read -r asset_file; do
            asset_path="/${asset_file#../alife-app/dist/}"
            headers="$(curl --fail --silent --show-error --head \
              --header 'Cache-Control: no-cache' \
              "https://ccalc.live${asset_path}")"
            content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { value=$0 } END { sub(/^[^:]+:[[:space:]]*/, "", value); sub(/\r$/, "", value); print tolower(value) }' <<< "$headers")"

            case "$asset_path" in
              *.js)
                if [[ "$content_type" != *javascript* && "$content_type" != *ecmascript* ]]; then
                  echo "Expected JavaScript for ${asset_path}, received Content-Type: ${content_type:-missing}"
                  exit 1
                fi
                ;;
              *.css)
                if [[ "$content_type" != text/css* ]]; then
                  echo "Expected CSS for ${asset_path}, received Content-Type: ${content_type:-missing}"
                  exit 1
                fi
                ;;
            esac
          done < <(find ../alife-app/dist/assets -type f \( -name '*.js' -o -name '*.css' \) | sort)

          echo "Verified deployed frontend routes and all JavaScript/CSS assets."
