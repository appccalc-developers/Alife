name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-worker.yml"
      - "cloudflare/alife-app/**"
      - "cloudflare/speed-layer/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CACHE_SYNC_API_TOKEN: ${{ secrets.CACHE_SYNC_API_TOKEN }}
      API_PROXY_TARGET: ${{ secrets.API_PROXY_TARGET }}
      VITE_YOUVERSION_APP_KEY: ${{ secrets.VITE_YOUVERSION_APP_KEY }}
      VITE_API_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloudflare/alife-app/package-lock.json
            cloudflare/speed-layer/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./cloudflare/alife-app
        run: npm ci

      - name: Build Frontend
        working-directory: ./cloudflare/alife-app
        run: npm run build

      - name: Install Speed-layer dependencies
        working-directory: ./cloudflare/speed-layer
        run: npm ci

      - name: Prepare Worker secrets
        working-directory: ./cloudflare/speed-layer
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing GitHub secret: GEMINI_API_KEY"
            exit 1
          fi

          if [ -z "${CACHE_SYNC_API_TOKEN:-}" ]; then
            echo "Missing GitHub secret: CACHE_SYNC_API_TOKEN"
            exit 1
          fi

          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'CACHE_SYNC_API_TOKEN=%s\n' "$CACHE_SYNC_API_TOKEN"
          } > .dev.vars

      - name: Test Worker speed layer
        working-directory: ./cloudflare/speed-layer
        run: npm test

      - name: Deploy Worker
        working-directory: ./cloudflare/speed-layer
        run: npx wrangler deploy --secrets-file .dev.vars
