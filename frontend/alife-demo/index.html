<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alife Church</title>
    <meta name="description" content="Alife Church app for sermons, groups, and pages." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#003366" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alife" />

    <!-- iOS touch icons (older iOS requires apple-touch-icon link tags) -->
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120x120.png" />

    <!-- iOS splash screens (apple-touch-startup-image) -->
    <!-- iPhone 5/SE 1st gen (640x1136) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone5-640x1136.png"
          media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- iPhone 6/7/8/SE 2nd/3rd gen (750x1334) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone6-750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- iPhone 6+/7+/8+ (1242x2208) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone6plus-1242x2208.png"
          media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone X/XS/11 Pro (1125x2436) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphonex-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone XR/11 (828x1792) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphonexr-828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- iPhone XS Max/11 Pro Max (1242x2688) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphonexsmax-1242x2688.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 12/12 Pro/13/13 Pro/14 (1170x2532) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone12-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 12 Pro Max/13 Pro Max/14 Plus (1284x2778) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone12promax-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 Pro/15/15 Pro (1179x2556) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone14pro-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 Pro Max/15 Plus/15 Pro Max (1290x2796) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-iphone14promax-1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPad (1536x2048) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-ipad-1536x2048.png"
          media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- iPad Pro 12.9" (2048x2732) -->
    <link rel="apple-touch-startup-image"
          href="/icons/splash-ipadpro-2048x2732.png"
          media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#003366" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
