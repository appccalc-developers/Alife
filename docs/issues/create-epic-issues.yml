name: Create Epic Issues (archived)

# Archived: the AI session/enrollment epic described by the original one-time
# issue creator has already landed in this repository. Keep this file only as a
# historical marker so it is not accidentally copied back into .github/workflows
# and re-run against stale paths.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain archived status
        run: |
          echo "Archived. Current implementation uses:"
          echo "- frontend/alife-app/worker/ai-session.ts"
          echo "- frontend/alife-app/worker/eventplanner.ts"
          echo "- frontend/alife-app/worker/enrollment.ts"
          echo "- frontend/alife-app/worker/review.ts"
          echo "- frontend/alife-app/src/services/aiSessionService.ts"
          echo "- frontend/alife-app/src/hooks/useAiSession.ts"
