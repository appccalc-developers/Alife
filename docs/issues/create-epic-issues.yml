name: Create Epic Issues (one-time)

on:
  push:
    branches:
      - copilot/improve-enrollment-ui-and-ai
    paths:
      - '.github/workflows/create-epic-issues.yml'

permissions:
  issues: write
  contents: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue B - Extract AI Session Facility
        id: issue_b
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_B_URL=$(gh issue create \
            --repo appccalc-developers/Alife \
            --title "Extract reusable AI Session Facility (Frontend + Cloudflare DO)" \
            --body "## Context

The AI chat session logic is currently implemented in two tightly coupled files:

- \`frontend/alife-app/worker/extractor.ts\` — \`EventPlanningSession\` Durable Object class + Gemini call
- \`frontend/alife-app/src/views/EventCreatorView.tsx\` — session ID management, SSE subscription, chat state

Enrollment (Issue C) and future features (Issue #73) need the same primitives. This issue extracts them into a shared facility.

## Scope

### Cloudflare Worker (worker layer)

- Extract a generic \`AiChatSession\` Durable Object base class / factory from \`EventPlanningSession\` that:
  - Holds \`chatHistory\`, \`currentDraft\`, and any \`legacySummary\`-equivalent field
  - Exposes \`/message\` (POST), \`/state\` (GET), \`/stream\` (GET SSE) sub-routes
  - Accepts a pluggable Gemini system instruction + response schema at construction time
  - Validates AI output against a caller-supplied schema
- Keep \`EventPlanningSession\` as a thin wrapper over the shared base (no behavior change)
- Register an \`ENROLLMENT_SESSIONS\` Durable Object namespace in \`wrangler.jsonc\` for enrollment sessions
- Route \`/api/enrollments/session/...\` to the enrollment DO (analogous to \`/api/events/session/...\`)

### Frontend (service + hooks layer)

- Extract a generic \`createAiSessionService(basePath: string)\` factory in \`src/services/\` that returns:
  - \`sendMessage(sessionId, message, inputMode)\` → \`AiSessionResponse<T>\`
  - \`getState(sessionId)\` → \`AiSessionState<T>\`
  - \`createStream(sessionId)\` → \`EventSource\`
- Keep existing \`eventService\` methods unchanged (thin wrappers)
- Provide \`enrollmentSessionService\` using the same factory
- Extract a \`useAiSession<T>(sessionId, basePath)\` custom hook encapsulating SSE lifecycle + message dispatch

### Types

- \`AiSessionState<T>\` — generic session state with \`draft: T | null\`, \`chatHistory\`, \`updatedAt\`
- \`AiSessionResponse<T>\` — generic response from a message send

## Acceptance Criteria

- [ ] \`EventPlanningSession\` continues to work without behavior change (event creation/edit flows pass existing tests)
- [ ] \`EnrollmentSession\` Durable Object exists and accepts pluggable system instruction + schema
- [ ] Generic frontend service factory and \`useAiSession\` hook exist
- [ ] \`npm run test:worker\` passes with updated/added tests covering the generic session lifecycle
- [ ] \`wrangler.jsonc\` includes the \`ENROLLMENT_SESSIONS\` binding

## Files Likely Touched

- \`frontend/alife-app/worker/extractor.ts\`
- \`frontend/alife-app/worker/index.ts\`
- \`frontend/alife-app/wrangler.jsonc\`
- \`frontend/alife-app/src/services/eventService.ts\` (thin wrapper refactor)
- \`frontend/alife-app/src/services/enrollmentSessionService.ts\` (new)
- \`frontend/alife-app/src/hooks/useAiSession.ts\` (new)
- \`frontend/alife-app/src/types/aiSession.ts\` (new)
- \`frontend/alife-app/worker/index.test.mjs\`")
          echo "url=$ISSUE_B_URL" >> $GITHUB_OUTPUT
          ISSUE_B_NUM=$(echo "$ISSUE_B_URL" | grep -o '[0-9]*$')
          echo "number=$ISSUE_B_NUM" >> $GITHUB_OUTPUT
          echo "Issue B: #$ISSUE_B_NUM ($ISSUE_B_URL)"

      - name: Create Issue C - Replace Enrollment Prompts
        id: issue_c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EPIC_REF="see the Epic issue"
          B_NUM="${{ steps.issue_b.outputs.number }}"
          ISSUE_C_URL=$(gh issue create \
            --repo appccalc-developers/Alife \
            --title "Replace enrollment prompts with AI chat dialog + explicit \"Create Enrollment\" action" \
            --body "## Context

The current enrollment UX (from #84) uses \`window.prompt\` / \`window.confirm\` / hidden file inputs looped from \`useGroupScreen\`. This is:

- Not suitable for a mobile PWA
- Not conversational
- Poorly integrated with AI (Gemini only generates prompt text, not a chat)

This issue replaces it with an AI chat dialog mirroring the \`EventCreatorView\` pattern, backed by a Cloudflare Durable Object session (from Issue #${B_NUM}).

Depends on: #${B_NUM} (shared AI facility).

## Scope

### New component: \`EnrollmentChatDialog\`

- Modal/sheet dialog opened from the \"Enroll\" button in \`GroupToolsDrawer\`
- Chat window (same bubble layout as \`EventCreatorView\`)
- AI collects enrollment fields via conversation (name, consent, dietary/other TBD fields)
- Shows enrollment draft preview (name, consent status, payment files to attach)
- \"Attach Payment Files\" action inline or as a final step
- **\"Create Enrollment\" button** below the draft preview — calls the backend API to commit
- Bilingual support (zh/en) following app language setting

### Worker: \`EnrollmentSession\` DO (via facility from Issue #${B_NUM})

- System instruction focused on enrollment data collection
- Response schema matching enrollment fields agreed in the Epic
- Session keyed by \`member-{memberId}-event-{eventId}-enrollment\`

### Frontend service

- \`enrollmentSessionService\` from Issue #${B_NUM}
- Remove the \`enrollEvent\` multi-step loop from \`useGroupScreen\`
- Replace \`eventService.enrollEvent\` stateless call with session-based flow

### Backend commit step

- Calls existing \`POST /api/group/{groupId}/enroll\` (no backend changes needed unless schema changes)

## Acceptance Criteria

- [ ] \"Enroll\" button in \`GroupToolsDrawer\` opens \`EnrollmentChatDialog\` instead of browser prompts
- [ ] Chat collects required fields; draft preview shown
- [ ] \"Create Enrollment\" button appears below draft and calls the enrollment API
- [ ] Files can be attached during or after chat collection
- [ ] Dialog handles loading, error, and success states
- [ ] Bilingual prompts/responses rendered per app language
- [ ] Old \`enrollEvent\` prompt/confirm loop removed from \`useGroupScreen\`
- [ ] Enrollment worker handler routes through DO session (stateless \`enrollment.ts\` replaced or deprecated)

## Files Likely Touched

- \`frontend/alife-app/src/components/group/EnrollmentChatDialog.tsx\` (new)
- \`frontend/alife-app/src/components/group/GroupToolsDrawer.tsx\`
- \`frontend/alife-app/src/hooks/useGroupScreen.ts\`
- \`frontend/alife-app/src/services/enrollmentSessionService.ts\` (from Issue #${B_NUM})
- \`frontend/alife-app/worker/enrollment.ts\` (replaced/deprecated)
- \`frontend/alife-app/worker/index.ts\`")
          echo "url=$ISSUE_C_URL" >> $GITHUB_OUTPUT
          ISSUE_C_NUM=$(echo "$ISSUE_C_URL" | grep -o '[0-9]*$')
          echo "number=$ISSUE_C_NUM" >> $GITHUB_OUTPUT
          echo "Issue C: #$ISSUE_C_NUM ($ISSUE_C_URL)"

      - name: Create Issue D - Migrate EventCreator to shared facility
        id: issue_d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B_NUM="${{ steps.issue_b.outputs.number }}"
          ISSUE_D_URL=$(gh issue create \
            --repo appccalc-developers/Alife \
            --title "Migrate EventCreator AI flow to shared AI facility" \
            --body "## Context

After Issue #${B_NUM} extracts the shared AI Session Facility, the event creation/edit flow in \`EventCreatorView\` and \`worker/extractor.ts\` should be migrated to use it. This keeps the event flow as a first-class consumer of the facility and validates the facility contract.

Depends on: #${B_NUM} (shared AI facility).

## Scope

- Refactor \`EventCreatorView\` to use the generic \`useAiSession<EventDto>\` hook from Issue #${B_NUM}, removing inline session ID management, SSE subscription setup, and message dispatch code
- Refactor \`worker/extractor.ts\` so \`EventPlanningSession\` is a thin wrapper of the shared base class from Issue #${B_NUM}
- No change to event creation/edit behavior or UI

## Acceptance Criteria

- [ ] \`EventCreatorView\` uses \`useAiSession<EventDto>\` hook (no inline SSE/state management)
- [ ] \`EventPlanningSession\` is implemented as a thin wrapper over the shared facility
- [ ] All existing \`npm run test:worker\` tests pass unchanged (no behavior regressions)
- [ ] Event creation, edit, and session restore behaviors are unchanged

## Files Likely Touched

- \`frontend/alife-app/src/views/EventCreatorView.tsx\`
- \`frontend/alife-app/worker/extractor.ts\`
- \`frontend/alife-app/src/services/eventService.ts\`")
          echo "url=$ISSUE_D_URL" >> $GITHUB_OUTPUT
          ISSUE_D_NUM=$(echo "$ISSUE_D_URL" | grep -o '[0-9]*$')
          echo "number=$ISSUE_D_NUM" >> $GITHUB_OUTPUT
          echo "Issue D: #$ISSUE_D_NUM ($ISSUE_D_URL)"

      - name: Create Issue A - Epic
        id: issue_a
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B_NUM="${{ steps.issue_b.outputs.number }}"
          C_NUM="${{ steps.issue_c.outputs.number }}"
          D_NUM="${{ steps.issue_d.outputs.number }}"
          ISSUE_A_URL=$(gh issue create \
            --repo appccalc-developers/Alife \
            --title "[Epic] AI Enrollment Rework + Shared AI Session Facility" \
            --body "## Overview

Issue #84 implemented event enrollment via a stateless Cloudflare Worker that walked users through a name → consent → file-upload loop using \`window.prompt\`/\`window.confirm\`. The UX is poor, the AI usage is superficial, and there is no session persistence.

This epic replaces that implementation and, at the same time, extracts a reusable **AI Session Facility** (frontend + Cloudflare Durable Object) that will serve both event creation and enrollment today, and Memory Harvesting / Automated Witness Walls (#73) in the future.

## Goals

1. Replace the prompt/confirm enrollment loop with an AI chat dialog that mirrors the \`EventCreatorView\` pattern.
2. Extract the AI session logic from \`EventCreatorView\`/\`worker/extractor.ts\` into a reusable facility consumed by both event creation and enrollment.
3. Use a Cloudflare Durable Object session for enrollment (same as events), replacing the stateless \`worker/enrollment.ts\` handler.
4. Lay the groundwork for #73 (Memory Harvesting & Automated Witness Walls) to consume the same facility.

## Non-Goals

- Changes to the backend enrollment API (\`EventEnrollmentsController\`, \`EnrollGroupEventCommandHandler\`) are out of scope unless a schema change is required.
- Mobile-native features, push notifications, or offline-first enrollment are out of scope for this epic.

## Dependency Map

| Issue | Title | Depends on |
|-------|-------|-----------|
| **#${B_NUM}** | Extract reusable AI Session Facility (Frontend + Cloudflare DO) | — |
| **#${C_NUM}** | Replace enrollment prompts with AI chat dialog + \"Create Enrollment\" action | #${B_NUM} |
| **#${D_NUM}** | Migrate EventCreator AI flow to shared AI facility | #${B_NUM} |
| **#73** | Memory Harvesting & Automated Witness Walls | #${B_NUM} (shared facility) |

## Open Questions / TBD

- **Enrollment data model**: Fields beyond \`eventId\`, name, consent, and payment file URLs? (e.g. dietary requirements, emergency contact, family size)
- **Session scope**: Per member+event pair? Per device? Expiry/retention policy?
- **File handling UX**: Attach files inline in chat, or as a final step after the draft is confirmed?
- **AI output contract**: Strict JSON schema + validation rules (matching EventDto approach)?
- **i18n**: Bilingual prompts/responses required for enrollment (zh + en)?
- **Consent wording**: Legal/compliance text to include in consent step?
- **Failure fallback**: Manual form fallback if Gemini is unavailable?

## References

- Closed: #84 (prior enrollment implementation, now to be replaced)
- Future: #73 (will consume the shared AI facility)
- \`frontend/alife-app/src/views/EventCreatorView.tsx\` — event chat UI pattern to replicate
- \`frontend/alife-app/worker/extractor.ts\` — \`EventPlanningSession\` DO to generalize
- \`frontend/alife-app/worker/enrollment.ts\` — stateless handler to replace")
          echo "url=$ISSUE_A_URL" >> $GITHUB_OUTPUT
          ISSUE_A_NUM=$(echo "$ISSUE_A_URL" | grep -o '[0-9]*$')
          echo "number=$ISSUE_A_NUM" >> $GITHUB_OUTPUT
          echo "Issue A: #$ISSUE_A_NUM ($ISSUE_A_URL)"

      - name: Summary
        run: |
          echo "## Issues Created" >> $GITHUB_STEP_SUMMARY
          echo "- Epic (A): #${{ steps.issue_a.outputs.number }} - ${{ steps.issue_a.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sub-issue B: #${{ steps.issue_b.outputs.number }} - ${{ steps.issue_b.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sub-issue C: #${{ steps.issue_c.outputs.number }} - ${{ steps.issue_c.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sub-issue D: #${{ steps.issue_d.outputs.number }} - ${{ steps.issue_d.outputs.url }}" >> $GITHUB_STEP_SUMMARY

      - name: Delete this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "copilot-swe-agent[bot]@users.noreply.github.com"
          git config --global user.name "copilot-swe-agent[bot]"
          git clone --depth=1 --branch copilot/improve-enrollment-ui-and-ai https://x-access-token:${GH_TOKEN}@github.com/appccalc-developers/Alife.git /tmp/repo-cleanup
          cd /tmp/repo-cleanup
          git rm .github/workflows/create-epic-issues.yml
          git commit -m "chore: remove one-time issue creation workflow

Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
